                        <div className="space-y-6">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-lg relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-8 opacity-10 text-white"><Icons.Lock /></div>
                                <h3 className="text-xl font-bold text-white mb-6 relative z-10">Jaminan Perlindungan</h3>
                                <ul className="space-y-4 relative z-10">
                                    <li className="flex items-start gap-3">
                                        <div className="w-1.5 h-1.5 rounded-full bg-green-400 mt-2 flex-shrink-0"></div>
                                        <p className="text-sm text-slate-300 leading-relaxed">Kerahasiaan Identitas Anda (Pelapor) dijamin penuh oleh Manajemen.</p>
                                    </li>
                                    <li className="flex items-start gap-3">
                                        <div className="w-1.5 h-1.5 rounded-full bg-green-400 mt-2 flex-shrink-0"></div>
                                        <p className="text-sm text-slate-300 leading-relaxed">Pelapor tidak perlu takut diintimidasi karena Manajemen menjamin penuh Keamanan Pelapor.</p>
                                    </li>
                                </ul>
                            </div>

                            <a href={WBS_INFO.formLink} target="_blank" className="block w-full bg-blue-600 hover:bg-blue-700 text-white p-6 rounded-3xl text-center shadow-lg transition-transform hover:-translate-y-1 active:scale-95 group">
                                <div className="flex justify-center mb-3 group-hover:scale-110 transition-transform"><Icons.Send /></div>
                                <h3 className="text-lg font-bold">Buat Laporan Sekarang</h3>
                                <p className="text-xs text-blue-200 mt-1">Via Form WBS AnterAja</p>
                            </a>
                        </div>
                    </div>

                    <div>
                        <h3 className="text-sm font-extrabold text-gray-400 uppercase tracking-wider mb-4 px-2 text-center sm:text-left">Saluran Laporan Lainnya</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div className="bg-white p-5 rounded-2xl border border-gray-100 flex items-center gap-4 hover:border-blue-200 transition-colors">
                                <div className="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-600"><Icons.Info /></div>
                                <div>
                                    <p className="text-[10px] font-bold text-gray-400 uppercase">Email</p>
                                    <a href={`mailto:${WBS_INFO.email}`} className="text-xs font-bold text-gray-900 hover:text-blue-600">{WBS_INFO.email}</a>
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl border border-gray-100 flex items-center gap-4 hover:border-blue-200 transition-colors">
                                <div className="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-600"><Icons.Phone /></div>
                                <div>
                                    <p className="text-[10px] font-bold text-gray-400 uppercase">Telepon / SMS / WA</p>
                                    <a href={`tel:${WBS_INFO.phone}`} className="text-xs font-bold text-gray-900 hover:text-blue-600">{WBS_INFO.phone}</a>
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl border border-gray-100 flex items-center gap-4 hover:border-blue-200 transition-colors sm:col-span-1">
                                <div className="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-600 shrink-0"><Icons.Folder /></div>
                                <div>
                                    <p className="text-[10px] font-bold text-gray-400 uppercase">Surat</p>
                                    <p className="text-[10px] font-medium text-gray-600 leading-tight">Kuningan City Mall, Lt 6-7 Up Divisi Internal Audit.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeView, setActiveView] = useState('home');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [darkMode, setDarkMode] = useState(false);
            const [showAddModal, setShowAddModal] = useState(false);
            const [currentAddSection, setCurrentAddSection] = useState('');
            const [editItemData, setEditItemData] = useState(null);
            const [editItemIndex, setEditItemIndex] = useState(null);

            const [dataApps, setDataApps] = useState(INITIAL_APPS);
            const [dataReports, setDataReports] = useState(INITIAL_REPORTS);
            const [dataMonitoring, setDataMonitoring] = useState(INITIAL_MONITORING);
            const [dataDocuments, setDataDocuments] = useState(INITIAL_DOCUMENTS);
            const [dataPhotos, setDataPhotos] = useState(INITIAL_PHOTOS);
            const [dataAccounts, setDataAccounts] = useState(ACCOUNT_DATA);
            const [dataWebUsers, setDataWebUsers] = useState([{ user: 'tim_ops', pass: 'kalsulam123' }]);
            const [showAccountModal, setShowAccountModal] = useState(false);
            const [editAccountData, setEditAccountData] = useState(null);
            const [editAccountIndex, setEditAccountIndex] = useState(null);
            const [gridCols, setGridCols] = useState({ apps: 4, reports: 4, monitoring: 4, documents: 2, gallery: 4 });

            const [adminAuth, setAdminAuth] = useState({ id: '10001596', pass: '123' });
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [isEditMode, setIsEditMode] = useState(false);
            const [loggedInUser, setLoggedInUser] = useState(null);

            const [firebaseDb, setFirebaseDb] = useState(null);
            const [user, setUser] = useState(null);
            const [appId, setAppId] = useState('default-app-id');
            const [isOffline, setIsOffline] = useState(false);

            const [modalConfig, setModalConfig] = useState({
                isOpen: false,
                type: 'alert',
                title: '',
                message: '',
                onConfirm: null,
                onCancel: null
            });

            const showAlert = (title, message) => {
                setModalConfig({
                    isOpen: true,
                    type: 'alert',
                    title,
                    message,
                    onConfirm: () => setModalConfig(prev => ({ ...prev, isOpen: false })),
                    onCancel: null
                });
            };

            const showConfirm = (title, message, onConfirm) => {
                setModalConfig({
                    isOpen: true,
                    type: 'confirm',
                    title,
                    message,
                    onConfirm: () => {
                        onConfirm();
                        setModalConfig(prev => ({ ...prev, isOpen: false }));
                    },
                    onCancel: () => setModalConfig(prev => ({ ...prev, isOpen: false }))
                });
            };

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            useEffect(() => {
                let unsubscribeAuth = () => {};
                const setupFirebase = async () => {
                    let configObj = null;
                    if (typeof __firebase_config !== 'undefined' && __firebase_config && __firebase_config !== '{}') {
                        configObj = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                    } else if (CUSTOM_FIREBASE_CONFIG) {
                        configObj = CUSTOM_FIREBASE_CONFIG;
                    }

                    if (!configObj) {
                        setIsOffline(true);
                        return;
                    }

                    try {
                        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'portal-hub-app';
                        setAppId(currentAppId);

                        if(window.firebase) {
                            const app = window.firebase.initializeApp(configObj);
                            const auth = app.auth();
                            setFirebaseDb(app.firestore());

                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await auth.signInWithCustomToken(__initial_auth_token);
                            } else {
                                await auth.signInAnonymously();
                            }

                            unsubscribeAuth = auth.onAuthStateChanged(setUser);
                        }
                    } catch(e) { 
                        console.error("Firebase init error", e); 
                        setIsOffline(true); 
                    }
                };

                setTimeout(setupFirebase, 500);
                
                return () => {
                    unsubscribeAuth();
                };
            }, []);

            useEffect(() => {
                if (!user || !firebaseDb) return;
                const docRef = firebaseDb.collection('artifacts').doc(appId).collection('public').doc('data').collection('dashboard').doc('settings');
                
                const unsubscribe = docRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        if(data.dataApps) setDataApps(data.dataApps);
                        if(data.dataReports) setDataReports(data.dataReports);
                        if(data.dataMonitoring) setDataMonitoring(data.dataMonitoring);
                        if(data.dataDocuments) setDataDocuments(data.dataDocuments);
                        if(data.dataPhotos) setDataPhotos(data.dataPhotos);
                        if(data.dataAccounts) setDataAccounts(data.dataAccounts);
                        if(data.dataWebUsers) setDataWebUsers(data.dataWebUsers);
                        if(data.gridCols) setGridCols(data.gridCols);
                        if(data.adminAuth) setAdminAuth(data.adminAuth);
                    } else {
                        docRef.set({ dataApps: INITIAL_APPS, dataReports: INITIAL_REPORTS, dataMonitoring: INITIAL_MONITORING, dataDocuments: INITIAL_DOCUMENTS, dataPhotos: INITIAL_PHOTOS, dataAccounts: ACCOUNT_DATA, dataWebUsers: [{ user: 'tim_ops', pass: 'kalsulam123' }], gridCols: { apps: 4, reports: 4, monitoring: 4, documents: 2, gallery: 4 }, adminAuth: { id: '10001596', pass: '123' } });
                    }
                }, error => console.error("Snapshot error:", error));

                return () => unsubscribe();
            }, [user, firebaseDb, appId]);

            const saveToCloud = async (updates) => {
                if (isOffline || !user || !firebaseDb) return;
                const docRef = firebaseDb.collection('artifacts').doc(appId).collection('public').doc('data').collection('dashboard').doc('settings');
                try { await docRef.set(updates, { merge: true }); } 
                catch (e) { console.error("Error saving:", e); }
            };

            const handleMenuClick = (viewId) => {
                setActiveView(viewId);
                setIsMobileMenuOpen(false);
            };

            const handleDelete = (section, index) => {
                showConfirm("Hapus Item", "Apakah Anda yakin ingin menghapus tautan ini secara permanen?", () => {
                    if (section === 'apps') { const n = dataApps.filter((_, i) => i !== index); setDataApps(n); saveToCloud({dataApps: n}); }
                    else if (section === 'reports') { const n = dataReports.filter((_, i) => i !== index); setDataReports(n); saveToCloud({dataReports: n}); }
                    else if (section === 'monitoring') { const n = dataMonitoring.filter((_, i) => i !== index); setDataMonitoring(n); saveToCloud({dataMonitoring: n}); }
                    else if (section === 'documents') { const n = dataDocuments.filter((_, i) => i !== index); setDataDocuments(n); saveToCloud({dataDocuments: n}); }
                    else if (section === 'gallery') { const n = dataPhotos.filter((_, i) => i !== index); setDataPhotos(n); saveToCloud({dataPhotos: n}); }
                });
            };

            const handleSaveItem = (newItem, section) => {
                const updateArray = (prev) => {
                    if (editItemIndex !== null) {
                        const newArr = [...prev];
                        newArr[editItemIndex] = newItem;
                        return newArr;
                    }
                    return [...prev, newItem];
                };

                if (section === 'apps') { const n = updateArray(dataApps); setDataApps(n); saveToCloud({dataApps: n}); }
                else if (section === 'reports') { const n = updateArray(dataReports); setDataReports(n); saveToCloud({dataReports: n}); }
                else if (section === 'monitoring') { const n = updateArray(dataMonitoring); setDataMonitoring(n); saveToCloud({dataMonitoring: n}); }
                else if (section === 'documents') { const n = updateArray(dataDocuments); setDataDocuments(n); saveToCloud({dataDocuments: n}); }
                else if (section === 'gallery') { const n = updateArray(dataPhotos); setDataPhotos(n); saveToCloud({dataPhotos: n}); }
                
                setShowAddModal(false);
                setEditItemData(null);
                setEditItemIndex(null);
            };

            const handleDeleteAccount = (index) => {
                showConfirm("Hapus Akun", "Apakah Anda yakin ingin menghapus akun ini?", () => {
                    const n = dataAccounts.filter((_, i) => i !== index);
                    setDataAccounts(n);
                    saveToCloud({dataAccounts: n});
                });
            };

            const handleSaveAccount = (newAccount) => {
                let n;
                if (editAccountIndex !== null) {
                    n = [...dataAccounts];
                    n[editAccountIndex] = newAccount;
                } else {
                    n = [...dataAccounts, newAccount];
                }
                setDataAccounts(n);
                saveToCloud({dataAccounts: n});
                setShowAccountModal(false);
                setEditAccountData(null);
                setEditAccountIndex(null);
            };

            const handleGridChange = (section, num) => {
                const n = { ...gridCols, [section]: num };
                setGridCols(n);
                saveToCloud({gridCols: n});
            };

            const openAddAccountModal = () => {
                setEditAccountData(null);
                setEditAccountIndex(null);
                setShowAccountModal(true);
            };

            const openEditAccountModal = (index, account) => {
                setEditAccountData(account);
                setEditAccountIndex(index);
                setShowAccountModal(true);
            };

            const openAddModal = (section) => {
                setCurrentAddSection(section);
                setEditItemData(null);
                setEditItemIndex(null);
                setShowAddModal(true);
            };

            const openEditModal = (section, index, item) => {
                setCurrentAddSection(section);
                setEditItemData(item);
                setEditItemIndex(index);
                setShowAddModal(true);
            };

            const renderContent = () => {
                switch(activeView) {
                    case 'home': return <HomeView setActiveView={handleMenuClick} dataApps={dataApps} dataReports={dataReports} dataMonitoring={dataMonitoring} dataDocuments={dataDocuments} />;
                    case 'apps': return <AppsView data={dataApps} dataAccounts={dataAccounts} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('apps')} onDeleteAccount={handleDeleteAccount} onEditAccount={openEditAccountModal} onAddAccount={openAddAccountModal} gridCols={gridCols} onGridChange={handleGridChange} showAlert={showAlert} />;
                    case 'reports': return <ReportsView data={dataReports} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('reports')} gridCols={gridCols} onGridChange={handleGridChange} showAlert={showAlert} />;
                    case 'monitoring': return <MonitoringView data={dataMonitoring} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('monitoring')} gridCols={gridCols} onGridChange={handleGridChange} showAlert={showAlert} />;
                    case 'documents': return <DocumentsView data={dataDocuments} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('documents')} gridCols={gridCols} onGridChange={handleGridChange} showAlert={showAlert} />;
                    case 'gallery': return <GalleryView data={dataPhotos} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('gallery')} gridCols={gridCols} onGridChange={handleGridChange} />;
                    case 'wbs': return <WhistleblowingView />;
                    default: return <HomeView setActiveView={handleMenuClick} dataApps={dataApps} dataReports={dataReports} dataMonitoring={dataMonitoring} dataDocuments={dataDocuments} />;
                }
            };

            return (
                <div className="w-full h-full bg-white flex overflow-hidden relative">
                    
                    <div className="md:hidden absolute top-0 left-0 right-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 p-4 flex justify-between items-center shrink-0">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-extrabold text-sm">P</div>
                            <h1 className="font-extrabold text-gray-900 text-sm tracking-tight">portalhub.</h1>
                        </div>
                        <button onClick={() => setIsMobileMenuOpen(true)} className="p-2 text-gray-600">
                            <Icons.Menu />
                        </button>
                    </div>

                    {isMobileMenuOpen && (
                        <div className="fixed inset-0 bg-black/20 z-40 md:hidden backdrop-blur-sm transition-opacity" onClick={() => setIsMobileMenuOpen(false)}></div>
                    )}

                    <aside className={`fixed md:relative inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-100 flex-shrink-0 flex flex-col h-full transform transition-transform duration-300 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-8 flex items-center gap-3 shrink-0">
                            <div className="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-extrabold text-sm">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="5" cy="5" r="3" fill="currentColor"/>
                                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                                    <circle cx="19" cy="19" r="3" fill="currentColor"/>
                                    <circle cx="5" cy="19" r="3" fill="currentColor"/>
                                    <circle cx="19" cy="5" r="3" fill="currentColor"/>
                                </svg>
                            </div>
                            <h1 className="font-extrabold text-gray-900 text-xl tracking-tight">portalhub.</h1>
                        </div>

                        <nav className="flex-1 px-4 space-y-1 overflow-y-auto">
                            <NavButton id="home" active={activeView === 'home'} onClick={() => handleMenuClick('home')} icon={<Icons.Home />} label="Beranda" />
                            <NavButton id="apps" active={activeView === 'apps'} onClick={() => handleMenuClick('apps')} icon={<Icons.Grid />} label="Aplikasi" badge="+" />
                            <NavButton id="reports" active={activeView === 'reports'} onClick={() => handleMenuClick('reports')} icon={<Icons.Report />} label="Laporan" badge="+" />
                            <NavButton id="monitoring" active={activeView === 'monitoring'} onClick={() => handleMenuClick('monitoring')} icon={<Icons.Monitor />} label="Tim & Monitoring" />
                            <NavButton id="documents" active={activeView === 'documents'} onClick={() => handleMenuClick('documents')} icon={<Icons.Folder />} label="Pengaturan Dok" />
                            <NavButton id="gallery" active={activeView === 'gallery'} onClick={() => handleMenuClick('gallery')} icon={<Icons.Photograph />} label="Galeri Foto" />
                        </nav>
                        
                        <div className="p-6 mt-auto space-y-6 shrink-0">
                            <button onClick={() => setActiveView('wbs')} className="flex items-center gap-3 w-full px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-900 rounded-xl hover:bg-gray-50">
                                <Icons.Info /> Bantuan & Informasi (WBS)
                            </button>
                        </div>
                    </aside>
                    
                    <main className="flex-1 h-full overflow-y-auto bg-white pt-20 md:pt-0 relative">
                        <div className="p-4 md:p-10 lg:p-12 min-h-full flex flex-col">
                            {isEditMode && (
                                <div className="bg-blue-50 border border-blue-100 text-blue-800 px-4 py-3 rounded-2xl mb-8 flex items-center shadow-sm shrink-0">
                                    <span className="mr-3 text-xl">🛠️</span>
                                    <div>
                                        <h4 className="font-bold text-sm">Mode Edit Aktif</h4>
                                        <p className="text-xs">Anda bisa menambah/menghapus tautan di semua menu.</p>
                                        {isOffline && <p className="text-[10px] mt-1 text-red-500 font-bold">⚠️ Mode Offline: Anda menjalankan file di luar sistem portal utama.</p>}
                                    </div>
                                </div>
                            )}
                            
                            <div className="flex-1">
                                {renderContent()}
                            </div>
                            
                            <footer className="mt-16 pt-8 border-t border-gray-100 text-center text-gray-400 text-[10px] font-medium uppercase tracking-wider pb-8 shrink-0">
                                &copy; 2026 {APP_TITLE} {APP_SUBTITLE}. Designed by {CONTACT.name}.
                            </footer>
                        </div>
                    </main>

                    <aside className="hidden lg:flex w-[320px] bg-white border-l border-gray-100 flex-shrink-0 p-6 overflow-hidden flex-col h-full">
                        <RightPanel firebaseDb={firebaseDb} appId={appId} isEditMode={isEditMode} setIsEditMode={setIsEditMode} isAdminLoggedIn={isAdminLoggedIn} setIsAdminLoggedIn={setIsAdminLoggedIn} adminAuth={adminAuth} saveToCloud={saveToCloud} loggedInUser={loggedInUser} setLoggedInUser={setLoggedInUser} dataWebUsers={dataWebUsers} setDataWebUsers={setDataWebUsers} showConfirm={showConfirm} />
                    </aside>

                    <CustomModal config={modalConfig} />

                    {showAddModal && <AddModal section={currentAddSection} onClose={() => setShowAddModal(false)} onSave={handleSaveItem} initialData={editItemData} />}

                    {showAccountModal && (
                        <AccountModal 
                            onClose={() => setShowAccountModal(false)} 
                            onSave={handleSaveAccount} 
                            initialData={editAccountData} 
                            existingApps={[...new Set(dataAccounts.map(r => r.app).filter(Boolean))]} 
                        />
                    )}
                </div>
            );
        }

        function AddModal({ section, onClose, onSave, initialData }) {
            const [name, setName] = useState(initialData ? initialData.name : '');
            const [desc, setDesc] = useState(initialData ? initialData.desc : '');
            const [icon, setIcon] = useState(initialData ? initialData.icon : '📌');
            const [color, setColor] = useState(initialData ? initialData.color : 'from-blue-500 to-blue-600');
            const [category, setCategory] = useState(initialData && initialData.category ? initialData.category : (section === 'reports' ? 'Daily' : 'SOP & Panduan Operasional'));

            const isGallery = section === 'gallery';

            const defaultLinks = [{label: 'Buka', url: ''}, {label: '', url: ''}, {label: '', url: ''}];
            if (initialData) {
                if (initialData.links && initialData.links.length > 0) {
                    for (let i = 0; i < initialData.links.length; i++) {
                        if(i < 3) defaultLinks[i] = initialData.links[i];
                    }
                } else if (initialData.url) {
                    defaultLinks[0] = {label: 'Buka', url: initialData.url};
                }
            }
            const [links, setLinks] = useState(defaultLinks);

            const handleLinkChange = (index, field, value) => {
                const newLinks = [...links];
                newLinks[index][field] = value;
                setLinks(newLinks);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (isGallery) {
                    onSave({ name, desc, url: links[0].url }, section);
                    return;
                }

                const validLinks = links.filter(l => l.url.trim() !== '');
                const newItem = { name, desc, icon, color };
                
                if (validLinks.length > 1 || (validLinks.length === 1 && validLinks[0].label !== 'Buka')) {
                    newItem.links = validLinks;
                    newItem.url = validLinks[0].url;
                } else if (validLinks.length === 1) {
                    newItem.url = validLinks[0].url;
                } else {
                    newItem.url = '#';
                }

                if (section === 'reports' || section === 'documents') newItem.category = category;
                onSave(newItem, section);
            };

            const colors = [
                { id: 'from-blue-500 to-blue-600', name: 'Biru' },
                { id: 'from-green-500 to-green-600', name: 'Hijau' },
                { id: 'from-red-500 to-red-600', name: 'Merah' },
                { id: 'from-orange-500 to-orange-600', name: 'Oranye' },
                { id: 'from-purple-500 to-purple-600', name: 'Ungu' },
                { id: 'from-pink-500 to-pink-600', name: 'Pink' },
            ];

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
                    <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl overflow-hidden fade-in">
                        <div className="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                            <h3 className="font-bold text-lg text-gray-800 dark:text-gray-100">{initialData ? (isGallery ? 'Edit Foto' : 'Edit Tombol') : (isGallery ? 'Tambah Foto' : 'Tambah Tombol Baru')}</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800 dark:hover:text-white"><Icons.X /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">{isGallery ? 'Judul Foto' : 'Nama Tombol'}</label>
                                <input required type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white" placeholder={isGallery ? "Contoh: Briefing Pagi" : "Contoh: Laporan Bulanan"} />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">{isGallery ? 'URL Gambar / Foto (Link Langsung .jpg/.png)' : 'Tautan / Tombol (Maksimal 3)'}</label>
                                <div className="space-y-2">
                                    {isGallery ? (
                                        <div className="flex gap-2">
                                            <input type="url" value={links[0].url} onChange={e => handleLinkChange(0, 'url', e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-xs" placeholder="https://contoh.com/foto.jpg" required />
                                        </div>
                                    ) : (
                                        [0, 1, 2].map(i => (
                                            <div key={i} className="flex gap-2">
                                                <input type="text" value={links[i].label} onChange={e => handleLinkChange(i, 'label', e.target.value)} className="w-1/3 px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-xs" placeholder={`Label ${i+1}`} />
                                                <input type="url" value={links[i].url} onChange={e => handleLinkChange(i, 'url', e.target.value)} className="w-2/3 px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-xs" placeholder={`URL ${i+1} (https://...)`} />
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                            
                            {!isGallery && (
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Ikon (Emoji/Teks Singkat)</label>
                                        <input required type="text" value={icon} onChange={e => setIcon(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white" maxLength="3" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Warna</label>
                                        <select value={color} onChange={e => setColor(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white">
                                            {colors.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                </div>
                            )}

                            {section === 'reports' && (
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Kategori Laporan</label>
                                    <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-black">
                                        <option value="Daily">Daily Ops</option>
                                        <option value="Inbound">Inbound</option>
                                        <option value="Outbound">Outbound</option>
                                        <option value="Handover">Handover</option>
                                    </select>
                                </div>
                            )}
                            {section === 'documents' && (
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Kategori Dokumen</label>
                                    <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-black">
                                        <option value="Program & Kompetisi">Program & Kompetisi</option>
                                        <option value="Project & Improvement">Project & Improvement</option>
                                        <option value="SOP & Panduan Operasional">SOP & Panduan Operasional</option>
                                    </select>
                                </div>
                            )}
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Deskripsi Singkat</label>
                                <textarea value={desc} onChange={e => setDesc(e.target.value)} className="w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-black" rows="2" placeholder="Penjelasan isi tombol..."></textarea>
                            </div>
                            <div className="pt-4 flex gap-3">
                                <button type="button" onClick={onClose} className="flex-1 py-2 px-4 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition">Batal</button>
                                <button type="submit" className="flex-1 py-2 px-4 bg-black text-white font-bold rounded-xl hover:bg-gray-800 transition">Simpan Tombol</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function AccountModal({ onClose, onSave, initialData, existingApps }) {
            const [user, setUser] = useState(initialData ? initialData.user : '');
            const [pass, setPass] = useState(initialData ? initialData.pass : '');
            const [appSelection, setAppSelection] = useState(initialData ? initialData.app : '');
            const [customApp, setCustomApp] = useState('');
            const [hub, setHub] = useState(initialData ? initialData.hub : '');
            const [rute, setRute] = useState(initialData ? initialData.rute : '');

            const handleSubmit = (e) => {
                e.preventDefault();
                const finalApp = appSelection === 'Lainnya' ? customApp : appSelection;
                onSave({ user, pass, app: finalApp, hub, rute });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
                    <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-3xl shadow-2xl overflow-hidden fade-in">
                        <div className="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                            <h3 className="font-bold text-lg text-gray-800 dark:text-gray-100">{initialData ? 'Edit Akun' : 'Tambah Akun Baru'}</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800 dark:hover:text-white"><Icons.X /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Username</label>
                                    <input required type="text" value={user} onChange={e => setUser(e.target.value)} className="w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-black" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Password</label>
                                    <input required type="text" value={pass} onChange={e => setPass(e.target.value)} className="w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-black" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Aplikasi</label>
                                <select value={appSelection} onChange={e => setAppSelection(e.target.value)} className="w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-black" required>
                                    <option value="">Pilih Aplikasi</option>
                                    {existingApps.map(a => <option key={a} value={a}>{a}</option>)}
                                    <option value="Lainnya">Tambah Baru (Lainnya)</option>
                                </select>
                                {appSelection === 'Lainnya' && (
                                    <input required type="text" value={customApp} onChange={e => setCustomApp(e.target.value)} placeholder="Masukkan Nama Aplikasi Baru" className="w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-black" />
                                )}
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">HUB</label>
                                    <input required type="text" value={hub} onChange={e => setHub(e.target.value)} className="w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-black" placeholder="Contoh: MKS" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Rute</label>
                                    <input type="text" value={rute} onChange={e => setRute(e.target.value)} className="w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-black" placeholder="Kosongkan jika tidak ada" />
                                </div>
                            </div>
                            <div className="pt-4 flex gap-3">
                                <button type="button" onClick={onClose} className="flex-1 py-2 px-4 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition">Batal</button>
                                <button type="submit" className="flex-1 py-2 px-4 bg-black text-white font-bold rounded-xl hover:bg-gray-800 transition">Simpan Akun</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ItemCard({ item, isEditMode, onDelete, onEdit, showAlert }) {
            const hasMultipleLinks = item.links && item.links.length > 0;
            const isLinkEmpty = !item.url || item.url === '#';
            
            const cardClass = `group relative flex flex-col justify-between p-4 sm:p-5 bg-white border border-gray-100 rounded-2xl transition-all duration-300 h-full transform hover:-translate-y-1 hover:shadow-xl hover:border-gray-300 ${isLinkEmpty ? 'border-orange-100 bg-orange-50/30' : ''}`;

            const handleCardClick = (e, url) => {
                if (url === '#' || url === '' || !url) {
                    e.preventDefault();
                    if (showAlert) showAlert("Akses Tertunda", "Fitur ini sedang dalam proses pengerjaan.");
                }
            };

            return (
                <div className="relative h-full">
                    {isEditMode && (
                        <div className="absolute -top-3 -right-3 z-20 flex gap-1">
                            <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); onEdit(); }} className="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center shadow-sm hover:bg-blue-600 hover:text-white transition-colors">
                                <Icons.Edit />
                            </button>
                            <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); onDelete(); }} className="w-8 h-8 bg-red-100 text-red-600 rounded-full flex items-center justify-center shadow-sm hover:bg-red-600 hover:text-white transition-colors">
                                <Icons.Trash />
                            </button>
                        </div>
                    )}
                    
                    {hasMultipleLinks ? (
                        <div className={cardClass}>
                            <div className="flex flex-col lg:flex-row items-start gap-3 sm:gap-4 mb-4">
                                <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center text-lg sm:text-xl bg-gradient-to-br ${item.color || 'from-gray-100 to-gray-200'} text-white shadow-inner flex-shrink-0`}>
                                    {item.icon}
                                </div>
                                <div>
                                    <h4 className="font-bold text-gray-900 text-xs sm:text-sm group-hover:text-black transition-colors line-clamp-2">{item.name}</h4>
                                    <div className="flex items-center gap-1.5 mt-1">
                                        <span className="w-1.5 h-1.5 rounded-full bg-orange-400"></span>
                                        <span className="text-[9px] sm:text-[10px] font-semibold text-gray-500 uppercase tracking-wider">{item.category || 'Koleksi'}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="space-y-2 mt-auto">
                                {item.links.map((link, idx) => {
                                    const isEmpty = link.url === '#' || !link.url;
                                    return (
                                        <a key={idx} href={link.url} target={isEmpty ? '_self' : '_blank'} onClick={(e) => handleCardClick(e, link.url)} className={`flex items-center justify-between px-2.5 py-2 sm:px-3 rounded-xl text-[10px] sm:text-xs font-bold transition-all duration-300 ${isEmpty ? 'bg-orange-50 text-orange-600' : 'bg-gray-50 text-gray-600 group-hover:bg-black group-hover:text-white shadow-sm'}`}>
                                            <span className="truncate mr-2">{link.label}</span>
                                            {isEmpty ? <Icons.Warning /> : <span className="transform group-hover:translate-x-1 transition-transform">→</span>}
                                        </a>
                                    )
                                })}
                            </div>
                        </div>
                    ) : (
                        <a href={item.url} target={isLinkEmpty ? '_self' : '_blank'} onClick={(e) => handleCardClick(e, item.url)} className={cardClass}>
                            <div className="flex flex-col lg:flex-row items-start gap-3 sm:gap-4 mb-4">
                                <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center text-lg sm:text-xl bg-gradient-to-br ${item.color || 'from-gray-100 to-gray-200'} text-white shadow-inner flex-shrink-0`}>
                                    {item.icon}
                                </div>
                                <div className="flex-1">
                                    <h4 className="font-bold text-gray-900 text-xs sm:text-sm group-hover:text-black transition-colors line-clamp-2">{item.name}</h4>
                                    <div className="flex items-center gap-1.5 mt-1">
                                        <span className={`w-1.5 h-1.5 rounded-full ${isLinkEmpty ? 'bg-orange-400' : 'bg-green-400'}`}></span>
                                        <span className="text-[9px] sm:text-[10px] font-semibold text-gray-500 uppercase tracking-wider">{isLinkEmpty ? 'On Hold' : (item.category || 'Tersedia')}</span>
                                    </div>
                                </div>
                            </div>
                            <div className="mt-auto">
                                <p className="text-[10px] sm:text-xs text-gray-500 mb-3 sm:mb-4 line-clamp-2">{item.desc || 'Klik untuk mengakses layanan ini'}</p>
                                <div className="flex justify-between items-center bg-gray-50 px-3 py-2 rounded-xl text-gray-500 group-hover:bg-black group-hover:text-white transition-all duration-300 shadow-sm">
                                    <span className="text-[9px] sm:text-[10px] font-bold">Buka Akses</span>
                                    <span className="transform group-hover:translate-x-1 transition-transform font-bold">→</span>
                                </div>
                            </div>
                        </a>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
