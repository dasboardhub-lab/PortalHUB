        };

        function RightPanel() {
            return (
                <div className="h-full flex flex-col pt-2">
                    {/* Profile Card */}
                    <div className="bg-[#f8f9fa] rounded-3xl p-6 flex flex-col items-center text-center shadow-sm relative">
                        <div className="absolute top-4 right-4 text-gray-400 hover:text-black cursor-pointer"><Icons.MoreDots /></div>
                        <div className="relative cursor-pointer transition-transform duration-300 hover:scale-110 active:scale-125">
                            <img src="https://i.ibb.co.com/vCHJJgRp/photoshoot-4.png" alt="Profile" className="w-20 h-20 rounded-full mb-3 shadow-md object-cover" />
                            <div className="absolute bottom-4 right-0 w-4 h-4 bg-green-400 border-2 border-white rounded-full"></div>

                        <h3 className="font-extrabold text-gray-900">{CONTACT.name}</h3>

                    </div>

                    {/* Activity Feed */}
                    <div className="mt-8 flex-1 flex flex-col">
                        <div className="flex justify-between items-center mb-6 px-2 border-b border-gray-100 pb-2">
                            <h4 className="text-sm font-bold text-gray-900">Aktivitas Terkini</h4>
                        </div>
                        <div className="space-y-6 flex-1 overflow-y-auto custom-scrollbar px-2">
                            <div className="flex gap-3">
                                <img src="https://ui-avatars.com/api/?name=Admin+App&background=e0e7ff&color=3730a3&rounded=true" className="w-8 h-8 rounded-full" />
                                <div>
                                    <div className="flex justify-between items-baseline mb-1">
                                        <p className="text-sm font-bold text-gray-900">Sistem Portal</p>
                                        <span className="text-[10px] text-gray-400">10:15 AM</span>
                                    </div>
                                    <p className="text-xs text-gray-500">Memperbarui tautan ke Aplikasi Aware Web.</p>
                                    <div className="mt-2 bg-blue-50 text-blue-800 text-xs p-3 rounded-xl rounded-tl-none font-medium">
                                        Pembaruan sistem operasional berhasil di-deploy.
                                    </div>
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <img src="https://ui-avatars.com/api/?name=Rider+MKS&background=dcfce7&color=166534&rounded=true" className="w-8 h-8 rounded-full" />
                                <div>
                                    <div className="flex justify-between items-baseline mb-1">
                                        <p className="text-sm font-bold text-gray-900">Rider MKS</p>
                                        <span className="text-[10px] text-gray-400">09:30 AM</span>
                                    </div>
                                    <p className="text-xs text-gray-500">Mengakses form Laporan Harian.</p>
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <img src={`https://ui-avatars.com/api/?name=${CONTACT.name}&background=fbcfe8&color=be185d&rounded=true`} className="w-8 h-8 rounded-full" />
                                <div>
                                    <div className="flex justify-between items-baseline mb-1">
                                        <p className="text-sm font-bold text-gray-900">{CONTACT.name}</p>
                                        <span className="text-[10px] text-gray-400">Kemarin</span>
                                    </div>
                                    <p className="text-xs text-gray-500">Menambahkan dokumen <span className="font-bold text-blue-600">SOP Operasional.pdf</span></p>

                        <div className="mt-4 pt-4 border-t border-gray-100 relative">
                            <div className="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 mt-2"><Icons.Grid /></div>
                            <input type="text" placeholder="Tulis pesan..." className="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 pl-10 pr-12 text-sm focus:outline-none focus:ring-2 focus:ring-blue-100" />

        }

        const getGridClass = (cols) => {
            if (cols === 2) return "grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mb-8";
            if (cols === 3) return "grid grid-cols-2 sm:grid-cols-3 gap-3 md:gap-4 mb-8";
            if (cols === 4) return "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4 mb-8";
            if (cols === 5) return "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 md:gap-4 mb-8";
            if (cols === 6) return "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 md:gap-4 mb-8";
            if (cols === 7) return "grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3 md:gap-4 mb-8";
            if (cols === 8) return "grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-3 md:gap-4 mb-8";
            return "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4 mb-8";
        };

        function GridControl({ section, gridCols, onGridChange }) {
            return (
                <div className="flex items-center gap-2 bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-lg text-xs font-bold text-gray-600 dark:text-gray-300">
                    <span>Kolom Desktop:</span>
                    {[2, 3, 4, 5, 6, 7, 8].map(num => (
                        <button key={num} onClick={() => onGridChange(section, num)} className={`w-6 h-6 rounded flex items-center justify-center ${gridCols[section] === num ? 'bg-pink-600 text-white' : 'bg-white dark:bg-gray-700 hover:bg-gray-200'}`}>
                            {num}
                        </button>
                    ))}
                </div>
            );
        }

        const handleLinkClick = (e, url) => {
            if (url === '#' || url === '' || !url) {
                e.preventDefault();
                alert("Fitur ini sedang dalam proses pengerjaan.");
            }
        };

        function App() {
            const [activeView, setActiveView] = useState('home');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [darkMode, setDarkMode] = useState(false);
            const [isEditMode, setIsEditMode] = useState(false);
            const [showAddModal, setShowAddModal] = useState(false);
            const [currentAddSection, setCurrentAddSection] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [passwordError, setPasswordError] = useState('');
            const [editItemData, setEditItemData] = useState(null);
            const [editItemIndex, setEditItemIndex] = useState(null);

            const [dataApps, setDataApps] = useState(INITIAL_APPS);
            const [dataReports, setDataReports] = useState(INITIAL_REPORTS);
            const [dataMonitoring, setDataMonitoring] = useState(INITIAL_MONITORING);
            const [dataDocuments, setDataDocuments] = useState(INITIAL_DOCUMENTS);
            const [dataAccounts, setDataAccounts] = useState(ACCOUNT_DATA);
            const [showAccountModal, setShowAccountModal] = useState(false);
            const [editAccountData, setEditAccountData] = useState(null);
            const [editAccountIndex, setEditAccountIndex] = useState(null);
            const [gridCols, setGridCols] = useState({ apps: 4, reports: 4, monitoring: 4, documents: 2 });

            const [firebaseDb, setFirebaseDb] = useState(null);
            const [user, setUser] = useState(null);
            const [appId, setAppId] = useState('default-app-id');
            const [isOffline, setIsOffline] = useState(false);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            useEffect(() => {
                let unsubscribeAuth = () => {};
                const setupFirebase = async () => {
                    let configObj = null;
                    if (typeof __firebase_config !== 'undefined' && __firebase_config && __firebase_config !== '{}') {
                        configObj = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                    } else if (CUSTOM_FIREBASE_CONFIG) {
                        configObj = CUSTOM_FIREBASE_CONFIG;
                    }

                    if (!configObj) {
                        setIsOffline(true);
                        return;
                    }

                    try {
                        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'portal-hub-app';
                        setAppId(currentAppId);

                        // Gunakan object firebase yang diekspos oleh script compat
                        if(window.firebase) {
                            const app = window.firebase.initializeApp(configObj);
                            const auth = app.auth();
                            setFirebaseDb(app.firestore());

                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await auth.signInWithCustomToken(__initial_auth_token);
                            } else {
                                await auth.signInAnonymously();
                            }

                            unsubscribeAuth = auth.onAuthStateChanged(setUser);
                        }
                    } catch(e) { 
                        console.error("Firebase init error", e); 
                        setIsOffline(true); 
                    }
                };

                // Tunggu sebentar untuk memastikan script firebase termuat
                setTimeout(setupFirebase, 500);
                
                return () => {
                    unsubscribeAuth();
                };
            }, []);

            useEffect(() => {
                if (!user || !firebaseDb) return;
                const docRef = firebaseDb.collection('artifacts').doc(appId).collection('public').doc('data').collection('dashboard').doc('settings');
                
                const unsubscribe = docRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        if(data.dataApps) setDataApps(data.dataApps);
                        if(data.dataReports) setDataReports(data.dataReports);
                        if(data.dataMonitoring) setDataMonitoring(data.dataMonitoring);
                        if(data.dataDocuments) setDataDocuments(data.dataDocuments);
                        if(data.dataAccounts) setDataAccounts(data.dataAccounts);
                        if(data.gridCols) setGridCols(data.gridCols);
                    } else {
                        docRef.set({ dataApps: INITIAL_APPS, dataReports: INITIAL_REPORTS, dataMonitoring: INITIAL_MONITORING, dataDocuments: INITIAL_DOCUMENTS, dataAccounts: ACCOUNT_DATA, gridCols: { apps: 4, reports: 4, monitoring: 4, documents: 2 } });
                    }
                }, error => console.error("Snapshot error:", error));

                return () => unsubscribe();
            }, [user, firebaseDb, appId]);

            const saveToCloud = async (updates) => {
                if (isOffline || !user || !firebaseDb) return;
                const docRef = firebaseDb.collection('artifacts').doc(appId).collection('public').doc('data').collection('dashboard').doc('settings');
                try { await docRef.set(updates, { merge: true }); } 
                catch (e) { console.error("Error saving:", e); }
            };

            const handleMenuClick = (viewId) => {
                setActiveView(viewId);
                setIsMobileMenuOpen(false);
            };

            const handleDelete = (section, index) => {
                if (!confirm("Hapus item ini?")) return;
                if (section === 'apps') { const n = dataApps.filter((_, i) => i !== index); setDataApps(n); saveToCloud({dataApps: n}); }
                else if (section === 'reports') { const n = dataReports.filter((_, i) => i !== index); setDataReports(n); saveToCloud({dataReports: n}); }
                else if (section === 'monitoring') { const n = dataMonitoring.filter((_, i) => i !== index); setDataMonitoring(n); saveToCloud({dataMonitoring: n}); }
                else if (section === 'documents') { const n = dataDocuments.filter((_, i) => i !== index); setDataDocuments(n); saveToCloud({dataDocuments: n}); }
            };

            const handleSaveItem = (newItem, section) => {
                const updateArray = (prev) => {
                    if (editItemIndex !== null) {
                        const newArr = [...prev];
                        newArr[editItemIndex] = newItem;
                        return newArr;
                    }
                    return [...prev, newItem];
                };

                if (section === 'apps') { const n = updateArray(dataApps); setDataApps(n); saveToCloud({dataApps: n}); }
                else if (section === 'reports') { const n = updateArray(dataReports); setDataReports(n); saveToCloud({dataReports: n}); }
                else if (section === 'monitoring') { const n = updateArray(dataMonitoring); setDataMonitoring(n); saveToCloud({dataMonitoring: n}); }
                else if (section === 'documents') { const n = updateArray(dataDocuments); setDataDocuments(n); saveToCloud({dataDocuments: n}); }
                
                setShowAddModal(false);
                setEditItemData(null);
                setEditItemIndex(null);
            };

            const handleDeleteAccount = (index) => {
                if (!confirm("Hapus akun ini?")) return;
                const n = dataAccounts.filter((_, i) => i !== index);
                setDataAccounts(n);
                saveToCloud({dataAccounts: n});
            };

            const handleSaveAccount = (newAccount) => {
                let n;
                if (editAccountIndex !== null) {
                    n = [...dataAccounts];
                    n[editAccountIndex] = newAccount;
                } else {
                    n = [...dataAccounts, newAccount];
                }
                setDataAccounts(n);
                saveToCloud({dataAccounts: n});
                setShowAccountModal(false);
                setEditAccountData(null);
                setEditAccountIndex(null);
            };

            const handleGridChange = (section, num) => {
                const n = { ...gridCols, [section]: num };
                setGridCols(n);
                saveToCloud({gridCols: n});
            };

            const openAddAccountModal = () => {
                setEditAccountData(null);
                setEditAccountIndex(null);
                setShowAccountModal(true);
            };

            const openEditAccountModal = (index, account) => {
                setEditAccountData(account);
                setEditAccountIndex(index);
                setShowAccountModal(true);
            };

            const openAddModal = (section) => {
                setCurrentAddSection(section);
                setEditItemData(null);
                setEditItemIndex(null);
                setShowAddModal(true);
            };

            const openEditModal = (section, index, item) => {
                setCurrentAddSection(section);
                setEditItemData(item);
                setEditItemIndex(index);
                setShowAddModal(true);
            };

            const toggleEditMode = () => {
                if (isEditMode) {
                    setIsEditMode(false);
                } else {
                    setShowPasswordModal(true);
                    setPasswordInput('');
                    setPasswordError('');
                }
            };

            const handlePasswordSubmit = (e) => {
                e.preventDefault();
                if (passwordInput === "TAB123") {
                    setIsEditMode(true);
                    setShowPasswordModal(false);
                } else {
                    setPasswordError("Password salah!");
                }
            };

            const renderContent = () => {
                switch(activeView) {
                    case 'home': return <HomeView setActiveView={handleMenuClick} dataApps={dataApps} dataReports={dataReports} dataMonitoring={dataMonitoring} dataDocuments={dataDocuments} />;
                    case 'apps': return <AppsView data={dataApps} dataAccounts={dataAccounts} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('apps')} onDeleteAccount={handleDeleteAccount} onEditAccount={openEditAccountModal} onAddAccount={openAddAccountModal} gridCols={gridCols} onGridChange={handleGridChange} />;
                    case 'reports': return <ReportsView data={dataReports} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('reports')} gridCols={gridCols} onGridChange={handleGridChange} />;
                    case 'monitoring': return <MonitoringView data={dataMonitoring} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('monitoring')} gridCols={gridCols} onGridChange={handleGridChange} />;
                    case 'documents': return <DocumentsView data={dataDocuments} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('documents')} gridCols={gridCols} onGridChange={handleGridChange} />;
                    case 'wbs': return <WhistleblowingView />;
                    default: return <HomeView setActiveView={handleMenuClick} dataApps={dataApps} dataReports={dataReports} dataMonitoring={dataMonitoring} dataDocuments={dataDocuments} />;
                }
            };

            return (
                <div className="w-full h-full app-container bg-white md:rounded-[2rem] md:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] flex overflow-hidden border border-gray-100 relative">
                    
                    {/* Mobile Header (Hidden on Desktop) */}
                    <div className="md:hidden absolute top-0 left-0 right-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 p-4 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-extrabold text-sm">P</div>
                            <h1 className="font-extrabold text-gray-900 text-sm tracking-tight">portalhub.</h1>
                        </div>
                        <button onClick={() => setIsMobileMenuOpen(true)} className="p-2 text-gray-600">
                            <Icons.Menu />
                        </button>
                    </div>

                    {isMobileMenuOpen && (
                        <div className="fixed inset-0 bg-black/20 z-40 md:hidden backdrop-blur-sm transition-opacity" onClick={() => setIsMobileMenuOpen(false)}></div>
                    )}

                    {/* Left Sidebar */}
                    <aside className={`fixed md:relative inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-100 flex-shrink-0 flex flex-col h-full transform transition-transform duration-300 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        {/* Logo Area */}
                        <div className="p-8 flex items-center gap-3">
                            <div className="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-extrabold text-sm">
                                {/* Dotted icon mock */}
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="5" cy="5" r="3" fill="currentColor"/>
                                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                                    <circle cx="19" cy="19" r="3" fill="currentColor"/>
                                    <circle cx="5" cy="19" r="3" fill="currentColor"/>
                                    <circle cx="19" cy="5" r="3" fill="currentColor"/>
                                </svg>
                            </div>
                            <h1 className="font-extrabold text-gray-900 text-xl tracking-tight">portalhub.</h1>
                        </div>

                        {/* Navigation */}
                        <nav className="flex-1 px-4 space-y-1 overflow-y-auto">
                            <NavButton id="home" active={activeView === 'home'} onClick={() => handleMenuClick('home')} icon={<Icons.Home />} label="Beranda" />
                            <NavButton id="apps" active={activeView === 'apps'} onClick={() => handleMenuClick('apps')} icon={<Icons.Grid />} label="Aplikasi" badge="+" />
                            <NavButton id="reports" active={activeView === 'reports'} onClick={() => handleMenuClick('reports')} icon={<Icons.Report />} label="Laporan" badge="+" />
                            <NavButton id="monitoring" active={activeView === 'monitoring'} onClick={() => handleMenuClick('monitoring')} icon={<Icons.Monitor />} label="Tim & Monitoring" />
                            <NavButton id="documents" active={activeView === 'documents'} onClick={() => handleMenuClick('documents')} icon={<Icons.Folder />} label="Pengaturan Dok" />
                        </nav>
                        
                        {/* Bottom Action Area */}
                        <div className="p-6 mt-auto space-y-6">
                            {/* Upgrade Box Mock -> "Bantuan" */}
                            <div className="bg-[#f8f9fa] p-5 rounded-2xl text-center shadow-sm border border-gray-50 relative overflow-hidden group">
                                <div className="absolute top-0 right-0 w-16 h-16 bg-blue-100 rounded-bl-full opacity-50 -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                                <h4 className="font-bold text-gray-900 text-sm mb-2 relative z-10">Mode Administrator</h4>
                                <p className="text-xs text-gray-500 mb-4 relative z-10">Buka akses edit dengan password.</p>
                                <button onClick={toggleEditMode} className={`w-full py-2.5 rounded-xl text-xs font-bold transition-all shadow-sm relative z-10 ${isEditMode ? 'bg-black text-white hover:bg-gray-800' : 'bg-[#e9ecef] text-gray-700 hover:bg-blue-100 hover:text-blue-700'}`}>
                                    {isEditMode ? 'Tutup Mode Edit' : 'Akses Edit'}
                                </button>
                            </div>

                            <div className="space-y-1">
                                <button onClick={() => setActiveView('wbs')} className="flex items-center gap-3 w-full px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-900 rounded-xl hover:bg-gray-50">
                                    <Icons.Info /> Bantuan & Informasi (WBS)
                                </button>
                            </div>
                        </div>
                    </aside>
                    
                    {/* Main Content Area (Center) */}
                    <main className="flex-1 overflow-y-auto bg-white pt-20 md:pt-0">
                        <div className="p-4 md:p-10 lg:p-12 min-h-full">
                            {isEditMode && (
                                <div className="bg-blue-50 border border-blue-100 text-blue-800 px-4 py-3 rounded-2xl mb-8 flex items-center shadow-sm">
                                    <span className="mr-3 text-xl">🛠️</span>
                                    <div>
                                        <h4 className="font-bold text-sm">Mode Edit Aktif</h4>
                                        <p className="text-xs">Anda bisa menambah/menghapus tautan di semua menu.</p>
                                        {isOffline && <p className="text-[10px] mt-1 text-red-500 font-bold">⚠️ Mode Offline: Anda menjalankan file di luar sistem portal utama.</p>}
                                    </div>
                                </div>
                            )}
                            
                            {renderContent()}
                            
                            <footer className="mt-16 pt-8 border-t border-gray-100 text-center text-gray-400 text-[10px] font-medium uppercase tracking-wider pb-8">
                                &copy; 2026 {APP_TITLE} {APP_SUBTITLE}. Designed by {CONTACT.name}.
                            </footer>
                        </div>
                    </main>

                    {/* Right Panel (Hidden on Mobile/Tablet) */}
                    <aside className="hidden lg:block w-[320px] bg-white border-l border-gray-100 flex-shrink-0 p-6 overflow-y-auto">
                        <RightPanel />
                    </aside>

                    {/* Modals */}
                    {showAddModal && <AddModal section={currentAddSection} onClose={() => setShowAddModal(false)} onSave={handleSaveItem} initialData={editItemData} />}

                    {showPasswordModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
                            <div className="bg-white dark:bg-dark-card w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden fade-in">
                                <div className="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                                    <h3 className="font-bold text-lg text-gray-800 dark:text-gray-100">Keamanan</h3>
                                    <button onClick={() => setShowPasswordModal(false)} className="text-gray-500 hover:text-gray-800 dark:hover:text-white"><Icons.X /></button>
                                </div>
                                <form onSubmit={handlePasswordSubmit} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Masukkan Password Edit</label>
                                        <input 
                                            type="password" 
                                            autoFocus
                                            value={passwordInput} 
                                            onChange={e => setPasswordInput(e.target.value)} 
                                            className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                            placeholder="******" 
                                        />
                                        {passwordError && <p className="text-red-500 text-xs mt-1 font-bold">{passwordError}</p>}
                                    </div>
                                    <div className="pt-2 flex gap-3">
                                        <button type="button" onClick={() => setShowPasswordModal(false)} className="flex-1 py-2 px-4 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition">Batal</button>
                                        <button type="submit" className="flex-1 py-2 px-4 bg-black text-white font-bold rounded-lg hover:bg-gray-800 transition">Verifikasi</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showAccountModal && (
                        <AccountModal 
                            onClose={() => setShowAccountModal(false)} 
                            onSave={handleSaveAccount} 
                            initialData={editAccountData} 
                            existingApps={[...new Set(dataAccounts.map(r => r.app).filter(Boolean))]} 
                        />
                    )}
                </div>
            );
        }

        function AddModal({ section, onClose, onSave, initialData }) {
            const [name, setName] = useState(initialData ? initialData.name : '');
            const [desc, setDesc] = useState(initialData ? initialData.desc : '');
            const [icon, setIcon] = useState(initialData ? initialData.icon : '📌');
            const [color, setColor] = useState(initialData ? initialData.color : 'from-blue-500 to-blue-600');
            const [category, setCategory] = useState(initialData && initialData.category ? initialData.category : (section === 'reports' ? 'Daily' : 'SOP & Panduan Operasional'));

            const defaultLinks = [{label: 'Buka', url: ''}, {label: '', url: ''}, {label: '', url: ''}];
            if (initialData) {
                if (initialData.links && initialData.links.length > 0) {
                    for (let i = 0; i < initialData.links.length; i++) {
                        if(i < 3) defaultLinks[i] = initialData.links[i];
                    }
                } else if (initialData.url) {
                    defaultLinks[0] = {label: 'Buka', url: initialData.url};
                }
            }
            const [links, setLinks] = useState(defaultLinks);

            const handleLinkChange = (index, field, value) => {
                const newLinks = [...links];
                newLinks[index][field] = value;
                setLinks(newLinks);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const validLinks = links.filter(l => l.url.trim() !== '');
                const newItem = { name, desc, icon, color };
                
                if (validLinks.length > 1 || (validLinks.length === 1 && validLinks[0].label !== 'Buka')) {
                    newItem.links = validLinks;
                    newItem.url = validLinks[0].url;
                } else if (validLinks.length === 1) {
                    newItem.url = validLinks[0].url;
                } else {
                    newItem.url = '#';
                }

                if (section === 'reports' || section === 'documents') newItem.category = category;
                onSave(newItem, section);
            };

            const colors = [
                { id: 'from-blue-500 to-blue-600', name: 'Biru' },
                { id: 'from-green-500 to-green-600', name: 'Hijau' },
                { id: 'from-red-500 to-red-600', name: 'Merah' },
                { id: 'from-orange-500 to-orange-600', name: 'Oranye' },
                { id: 'from-purple-500 to-purple-600', name: 'Ungu' },
                { id: 'from-pink-500 to-pink-600', name: 'Pink' },
            ];

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
                    <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl overflow-hidden fade-in">
                        <div className="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                            <h3 className="font-bold text-lg text-gray-800 dark:text-gray-100">{initialData ? 'Edit Tombol' : 'Tambah Tombol Baru'}</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800 dark:hover:text-white"><Icons.X /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Nama Tombol</label>
                                <input required type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white" placeholder="Contoh: Laporan Bulanan" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Tautan / Tombol (Maksimal 3)</label>
                                <div className="space-y-2">
                                    {[0, 1, 2].map(i => (
                                        <div key={i} className="flex gap-2">
                                            <input type="text" value={links[i].label} onChange={e => handleLinkChange(i, 'label', e.target.value)} className="w-1/3 px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-xs" placeholder={`Label ${i+1}`} />
                                            <input type="text" value={links[i].url} onChange={e => handleLinkChange(i, 'url', e.target.value)} className="w-2/3 px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-xs" placeholder={`URL ${i+1} (https://...)`} />
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Ikon (Emoji/Teks Singkat)</label>
                                    <input required type="text" value={icon} onChange={e => setIcon(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white" maxLength="3" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Warna</label>
                                    <select value={color} onChange={e => setColor(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white">
                                        {colors.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                            </div>
                            {section === 'reports' && (
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Kategori Laporan</label>
                                    <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white">
                                        <option value="Daily">Daily Ops</option>
                                        <option value="Inbound">Inbound</option>
                                        <option value="Outbound">Outbound</option>
                                        <option value="Handover">Handover</option>
                                    </select>
                                </div>
                            )}
                            {section === 'documents' && (
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Kategori Dokumen</label>
                                    <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white">
                                        <option value="Program & Kompetisi">Program & Kompetisi</option>
                                        <option value="Project & Improvement">Project & Improvement</option>
                                        <option value="SOP & Panduan Operasional">SOP & Panduan Operasional</option>
                                    </select>
                                </div>
                            )}
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Deskripsi Singkat</label>
                                <textarea value={desc} onChange={e => setDesc(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white" rows="2" placeholder="Penjelasan isi tombol..."></textarea>
                            </div>
                            <div className="pt-4 flex gap-3">
                                <button type="button" onClick={onClose} className="flex-1 py-2 px-4 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition">Batal</button>
                                <button type="submit" className="flex-1 py-2 px-4 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">Simpan Tombol</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function AccountModal({ onClose, onSave, initialData, existingApps }) {
            const [user, setUser] = useState(initialData ? initialData.user : '');
            const [pass, setPass] = useState(initialData ? initialData.pass : '');
            const [appSelection, setAppSelection] = useState(initialData ? initialData.app : '');
            const [customApp, setCustomApp] = useState('');
            const [hub, setHub] = useState(initialData ? initialData.hub : '');
            const [rute, setRute] = useState(initialData ? initialData.rute : '');

            const handleSubmit = (e) => {
                e.preventDefault();
                const finalApp = appSelection === 'Lainnya' ? customApp : appSelection;
                onSave({ user, pass, app: finalApp, hub, rute });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
                    <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl overflow-hidden fade-in">
                        <div className="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                            <h3 className="font-bold text-lg text-gray-800 dark:text-gray-100">{initialData ? 'Edit Akun' : 'Tambah Akun Baru'}</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800 dark:hover:text-white"><Icons.X /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Username</label>
                                    <input required type="text" value={user} onChange={e => setUser(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Password</label>
                                    <input required type="text" value={pass} onChange={e => setPass(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Aplikasi</label>
                                <select value={appSelection} onChange={e => setAppSelection(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm mb-2" required>
                                    <option value="">Pilih Aplikasi</option>
                                    {existingApps.map(a => <option key={a} value={a}>{a}</option>)}
                                    <option value="Lainnya">Tambah Baru (Lainnya)</option>
                                </select>
                                {appSelection === 'Lainnya' && (
                                    <input required type="text" value={customApp} onChange={e => setCustomApp(e.target.value)} placeholder="Masukkan Nama Aplikasi Baru" className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm" />
                                )}
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">HUB</label>
                                    <input required type="text" value={hub} onChange={e => setHub(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm" placeholder="Contoh: MKS" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Rute</label>
                                    <input type="text" value={rute} onChange={e => setRute(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm" placeholder="Kosongkan jika tidak ada" />
                                </div>
                            </div>
                            <div className="pt-4 flex gap-3">
                                <button type="button" onClick={onClose} className="flex-1 py-2 px-4 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition">Batal</button>
                                <button type="submit" className="flex-1 py-2 px-4 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">Simpan Akun</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ItemCard({ item, isEditMode, onDelete, onEdit }) {
            const hasMultipleLinks = item.links && item.links.length > 0;
            const isLinkEmpty = !item.url || item.url === '#';
            
            // Clean minimal card styling mimicking the "Current Tasks" rows
            const cardClass = `group relative flex flex-col justify-between p-4 sm:p-5 bg-white border border-gray-100 rounded-2xl hover:shadow-lg transition-all duration-300 h-full ${isLinkEmpty ? 'border-orange-100 bg-orange-50/30' : 'hover:border-blue-100'}`;

            return (
                <div className="relative h-full">
                    {isEditMode && (
                        <div className="absolute -top-3 -right-3 z-20 flex gap-1">
                            <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); onEdit(); }} className="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center shadow-sm hover:bg-blue-600 hover:text-white transition-colors">
                                <Icons.Edit />
                            </button>
                            <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); onDelete(); }} className="w-8 h-8 bg-red-100 text-red-600 rounded-full flex items-center justify-center shadow-sm hover:bg-red-600 hover:text-white transition-colors">
                                <Icons.Trash />
                            </button>
                        </div>
                    )}
                    
                    {hasMultipleLinks ? (
                        <div className={cardClass}>
                            <div className="flex flex-col lg:flex-row items-start gap-3 sm:gap-4 mb-4">
                                <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center text-lg sm:text-xl bg-gradient-to-br ${item.color || 'from-gray-100 to-gray-200'} text-white shadow-inner flex-shrink-0`}>
                                    {item.icon}
                                </div>
                                <div>
                                    <h4 className="font-bold text-gray-900 text-xs sm:text-sm group-hover:text-blue-600 transition-colors line-clamp-2">{item.name}</h4>
                                    <div className="flex items-center gap-1.5 mt-1">
                                        <span className="w-1.5 h-1.5 rounded-full bg-orange-400"></span>
                                        <span className="text-[9px] sm:text-[10px] font-semibold text-gray-500 uppercase tracking-wider">{item.category || 'Koleksi'}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="space-y-2 mt-auto">
                                {item.links.map((link, idx) => {
                                    const isEmpty = link.url === '#' || !link.url;
                                    return (
                                        <a key={idx} href={link.url} target={isEmpty ? '_self' : '_blank'} onClick={(e) => handleLinkClick(e, link.url)} className={`flex items-center justify-between px-2.5 py-2 sm:px-3 rounded-xl text-[10px] sm:text-xs font-bold transition-colors ${isEmpty ? 'bg-orange-50 text-orange-600' : 'bg-gray-50 text-gray-600 hover:bg-blue-50 hover:text-blue-600'}`}>
                                            <span className="truncate mr-2">{link.label}</span>
                                            {isEmpty ? <Icons.Warning /> : <Icons.External />}
                                        </a>
                                    )
                                })}
                            </div>
                        </div>
                    ) : (
                        <a href={item.url} target={isLinkEmpty ? '_self' : '_blank'} onClick={(e) => handleLinkClick(e, item.url)} className={cardClass}>

        function AppsView({ data, dataAccounts, isEditMode, onDelete, onEdit, onAdd, onDeleteAccount, onEditAccount, onAddAccount }) {
            const [searchQuery, setSearchQuery] = useState("");
            const [filterAppType, setFilterAppType] = useState('All');
            const [filterHub, setFilterHub] = useState('All');

            const filteredApps = data.filter(app => 
                app.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                (app.desc && app.desc.toLowerCase().includes(searchQuery.toLowerCase()))
            );

            const uniqueHubs = ['All', ...new Set(dataAccounts.map(r => r.hub).filter(Boolean))].sort();
            const uniqueApps = ['All', ...new Set(dataAccounts.map(r => r.app).filter(Boolean))].sort();

            const filteredRiders = dataAccounts.filter(rider => {
                const matchSearch = rider.user.includes(searchQuery) || 
                                    (rider.hub && rider.hub.toLowerCase().includes(searchQuery.toLowerCase())) ||
                                    (rider.rute && rider.rute.toLowerCase().includes(searchQuery.toLowerCase()));
                const matchApp = filterAppType === 'All' || rider.app === filterAppType;
                const matchHub = filterHub === 'All' || rider.hub === filterHub;

                return matchSearch && matchApp && matchHub;
            });

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                alert("Disalin: " + text);
            };

            return (
                <div className="fade-in">
                    <div className="mb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                         <div>
                            <h2 className="text-2xl font-extrabold text-gray-900 tracking-tight">Aplikasi Internal</h2>
                            <p className="text-sm text-gray-500 mt-1 font-medium">Kumpulan tautan untuk kebutuhan sistem utama.</p>
                        </div>
                         <div className="flex items-center gap-3 w-full md:w-auto">
                            <div className="relative w-full md:w-auto">
                                <input type="text" placeholder="Cari aplikasi..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full md:w-64 pl-10 pr-4 py-2 border border-gray-200 rounded-xl text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-100 font-medium" />
                                <div className="absolute left-3.5 top-1/2 transform -translate-y-1/2 text-gray-400"><Icons.Grid /></div>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4 mb-10">
                        {filteredApps.map((app, idx) => (
                            <ItemCard key={idx} item={app} isEditMode={isEditMode} onDelete={() => onDelete('apps', idx)} onEdit={() => onEdit('apps', idx, app)} />
                        ))}
                        {isEditMode && <AddButtonPlaceholder onClick={onAdd} title="Tambah Aplikasi" />}
                    </div>

                    <div className="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden mb-10">
                        <div className="p-6 border-b border-gray-50 bg-[#f8f9fa] flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <h3 className="font-extrabold text-gray-900 flex items-center text-base">
                                Manajemen Akun Tim
                            </h3>
                            
                            <div className="flex flex-row gap-2 w-full md:w-auto">
                                {isEditMode && (
                                    <button onClick={onAddAccount} className="bg-black text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-gray-800 shadow-sm whitespace-nowrap">
                                        + Tambah Akun
                                    </button>
                                )}
                                <div className="relative w-1/2 sm:w-auto">
                                    <select value={filterAppType} onChange={(e) => setFilterAppType(e.target.value)} className="appearance-none w-full bg-white border border-gray-200 text-gray-700 py-2 pl-4 pr-10 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-blue-100">
                                        {uniqueApps.map(app => <option key={app} value={app}>{app === 'All' ? 'Semua App' : app}</option>)}
                                    </select>
                                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400"><Icons.Filter /></div>
                                </div>
                                {/* Hub select omitted for brevity, same logic */}
                            </div>
                        </div>

                        <div className="overflow-x-auto custom-scrollbar">
                            <table className="w-full text-sm text-left text-gray-500">
                                <thead className="text-[10px] text-gray-400 uppercase tracking-wider bg-white border-b border-gray-100">
                                    <tr>
                                        <th className="px-6 py-4 font-extrabold">Username</th>
                                        <th className="px-6 py-4 font-extrabold">Password</th>
                                        <th className="px-6 py-4 font-extrabold">Aplikasi</th>
                                        <th className="px-6 py-4 font-extrabold">HUB</th>
                                        <th className="px-6 py-4 font-extrabold">Rute</th>
                                        {isEditMode && <th className="px-6 py-4 font-extrabold">Aksi</th>}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-50">
                                    {filteredRiders.map((rider, index) => {
                                        const actualIndex = dataAccounts.findIndex(acc => acc === rider);
                                        return (
                                        <tr key={index} className="hover:bg-[#f8f9fa] transition-colors">
                                            <td className="px-6 py-4 font-bold text-gray-900 whitespace-nowrap">
                                                <div className="flex items-center gap-3">
                                                    {rider.user}
                                                    <button onClick={() => copyToClipboard(rider.user)} className="text-gray-300 hover:text-blue-500"><Icons.Copy /></button>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 font-mono text-xs whitespace-nowrap">
                                                 <div className="flex items-center gap-3">
                                                    ********
                                                    <button onClick={() => copyToClipboard(rider.pass)} className="text-gray-300 hover:text-blue-500"><Icons.Copy /></button>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap"><span className="bg-blue-50 text-blue-700 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">{rider.app}</span></td>
                                            <td className="px-6 py-4 font-bold text-gray-700 whitespace-nowrap">{rider.hub}</td>
                                            <td className="px-6 py-4 text-xs font-medium whitespace-nowrap">{rider.rute || "-"}</td>
                                            {isEditMode && (
                                                <td className="px-6 py-4 whitespace-nowrap">
                                                    <div className="flex gap-2">
                                                        <button onClick={() => onEditAccount(actualIndex, rider)} className="text-blue-500 hover:bg-blue-50 p-1.5 rounded-lg"><Icons.Edit /></button>
                                                        <button onClick={() => onDeleteAccount(actualIndex)} className="text-red-500 hover:bg-red-50 p-1.5 rounded-lg"><Icons.Trash /></button>
                                                    </div>
                                                </td>
                                            )}
                                        </tr>
                                    )})}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function ReportsView({ data, isEditMode, onDelete, onEdit, onAdd }) {

                            </p>
                            
                            <a href={WBS_INFO.formLink} target="_blank" className="group relative inline-flex items-center justify-center gap-3 px-8 py-4 bg-white text-slate-900 font-extrabold rounded-2xl overflow-hidden transition-transform active:scale-95 hover:scale-105 shadow-[0_0_40px_rgba(255,255,255,0.1)] hover:shadow-[0_0_60px_rgba(255,255,255,0.3)] text-lg">
                                <div className="absolute inset-0 w-full h-full bg-gradient-to-r from-blue-50 to-purple-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                <span className="relative z-10 flex items-center gap-2">
                                    Buat Laporan Sekarang 
                                    <svg className="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </span>
                            </a>
                        </div>
                    </div>

                    {/* Info Text */}
                    <div className="bg-white rounded-3xl p-8 md:p-10 border border-gray-100 shadow-sm text-center relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-gray-50 rounded-bl-full -mr-10 -mt-10"></div>
                        <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-6 shadow-inner">⚖️</div>
                        <h3 className="text-xl md:text-2xl font-extrabold text-gray-900 mb-4 tracking-tight">Sistem Pelaporan Pelanggaran (WBS)</h3>
                        <p className="text-sm md:text-base text-gray-600 font-medium leading-relaxed max-w-3xl mx-auto mb-6">
                            Sebagai bentuk penerapan <span className="font-extrabold text-gray-900">Good Corporate Governance</span>, Anteraja berkomitmen menjalankan operasional secara profesional, bersih, jujur, dan adil sesuai dengan nilai <span className="font-extrabold text-gray-900">SATRIA</span>.<br/><br/>
                            Kami mendorong Anda (Internal maupun Eksternal) untuk segera melaporkan setiap dugaan pelanggaran melalui fasilitas ini.
                        </p>
                        <div className="inline-block bg-[#f0f7ff] text-blue-800 text-sm font-bold py-3 px-6 rounded-xl border border-[#e0f0ff] shadow-sm">
                            ⚠️ Laporan yang detail & menyertakan bukti akan mempercepat proses investigasi!
                        </div>
                    </div>

                    {/* Grid Syarat & Jaminan */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Syarat */}
                        <div className="bg-white rounded-3xl p-6 sm:p-8 border border-gray-100 shadow-sm relative overflow-hidden group hover:border-blue-200 transition-colors">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-blue-50/50 rounded-bl-full transition-transform group-hover:scale-110"></div>
                            <h4 className="text-xl font-extrabold text-gray-900 mb-6 flex items-center gap-3 relative z-10">
                                <div className="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-lg">📝</div>
                                Unsur Laporan (5W + 1H)
                            </h4>
                            <div className="space-y-3 text-sm font-medium text-gray-600 relative z-10">
                                <div className="flex gap-3 sm:gap-4 p-3 bg-gray-50 rounded-xl hover:bg-blue-50 transition-colors"><span className="w-12 sm:w-14 font-extrabold text-blue-700">Who:</span><span className="text-gray-900">Siapa pihak terlapor dan pihak terkait?</span></div>
                                <div className="flex gap-3 sm:gap-4 p-3 bg-gray-50 rounded-xl hover:bg-blue-50 transition-colors"><span className="w-12 sm:w-14 font-extrabold text-blue-700">What:</span><span className="text-gray-900">Apa kecurangan yang terjadi?</span></div>
                                <div className="flex gap-3 sm:gap-4 p-3 bg-gray-50 rounded-xl hover:bg-blue-50 transition-colors"><span className="w-12 sm:w-14 font-extrabold text-blue-700">Where:</span><span className="text-gray-900">Di mana lokasi kejadiannya?</span></div>
                                <div className="flex gap-3 sm:gap-4 p-3 bg-gray-50 rounded-xl hover:bg-blue-50 transition-colors"><span className="w-12 sm:w-14 font-extrabold text-blue-700">When:</span><span className="text-gray-900">Kapan waktu pelanggaran terjadi?</span></div>
                                <div className="flex gap-3 sm:gap-4 p-3 bg-gray-50 rounded-xl hover:bg-blue-50 transition-colors"><span className="w-12 sm:w-14 font-extrabold text-blue-700">Why:</span><span className="text-gray-900">Mengapa pelanggaran tersebut terjadi?</span></div>
                                <div className="flex gap-3 sm:gap-4 p-3 bg-gray-50 rounded-xl hover:bg-blue-50 transition-colors"><span className="w-12 sm:w-14 font-extrabold text-blue-700">How:</span><span className="text-gray-900">Bagaimana cara pelanggaran terjadi?</span></div>
                                <div className="flex gap-3 sm:gap-4 p-3 bg-blue-50 rounded-xl border border-blue-100"><span className="w-12 sm:w-14 font-extrabold text-blue-700">Proof:</span><span className="text-gray-900 font-bold">Wajib melampirkan bukti fisik/digital.</span></div>
                            </div>
                        </div>

                        {/* Jaminan */}
                        <div className="bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-xl relative overflow-hidden group">
                            <div className="absolute top-0 right-0 w-40 h-40 bg-emerald-500/10 rounded-bl-full transition-transform group-hover:scale-110"></div>
                            <h4 className="text-xl font-extrabold text-white mb-6 flex items-center gap-3 relative z-10">
                                <div className="w-10 h-10 bg-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center text-lg border border-emerald-500/30">🛡️</div>
                                Jaminan Perlindungan
                            </h4>
                            <p className="text-sm font-medium text-slate-300 mb-8 relative z-10 leading-relaxed">
                                Perusahaan memberikan jaminan penuh untuk melindungi Anda. Tidak perlu takut untuk menyuarakan kebenaran.
                            </p>
                            <div className="space-y-4 relative z-10">
                                <div className="bg-slate-800/50 backdrop-blur-md px-5 py-4 rounded-2xl flex items-center gap-4 border border-slate-700 shadow-sm text-sm font-bold text-white hover:bg-slate-800 transition-colors">
                                    <div className="w-6 h-6 shrink-0 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center"><Icons.Check /></div>
                                    Kerahasiaan Identitas Pelapor
                                </div>
                                <div className="bg-slate-800/50 backdrop-blur-md px-5 py-4 rounded-2xl flex items-center gap-4 border border-slate-700 shadow-sm text-sm font-bold text-white hover:bg-slate-800 transition-colors">
                                    <div className="w-6 h-6 shrink-0 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center"><Icons.Check /></div>
                                    Kerahasiaan Penuh Isi Laporan
                                </div>
                                <div className="bg-slate-800/50 backdrop-blur-md px-5 py-4 rounded-2xl flex items-center gap-4 border border-slate-700 shadow-sm text-sm font-bold text-white hover:bg-slate-800 transition-colors">
                                    <div className="w-6 h-6 shrink-0 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center"><Icons.Check /></div>
                                    Perlindungan Karir bagi Pemberi Informasi
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Contact Cards */}
                    <div className="pt-8">
                        <h3 className="text-center text-lg font-extrabold text-gray-900 mb-8 uppercase tracking-widest flex items-center justify-center gap-4">
                            <span className="w-10 h-0.5 bg-gray-200 hidden sm:block"></span>
                            Contact Center Alternatif
                            <span className="w-10 h-0.5 bg-gray-200 hidden sm:block"></span>
                        </h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <a href={WBS_INFO.formLink} target="_blank" className="flex flex-col items-center justify-center p-6 bg-white border border-gray-100 rounded-3xl hover:border-black hover:shadow-xl hover:-translate-y-1 transition-all text-center group">
                                <div className="w-14 h-14 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-2xl group-hover:scale-110 transition-transform shadow-inner">📝</div>
                                <div className="text-sm font-extrabold text-gray-900 group-hover:text-blue-600">Form Online</div>
                                <div className="text-[11px] text-gray-400 mt-2 font-medium">Lapor via Portal Web</div>
                            </a>
                            
                            <div className="flex flex-col items-center justify-center p-6 bg-white border border-gray-100 rounded-3xl hover:border-gray-300 transition-all text-center group cursor-default relative overflow-hidden">
                                <div className="w-14 h-14 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-2xl shadow-inner">📮</div>
                                <div className="text-sm font-extrabold text-gray-900">Kirim Surat</div>
                                <div className="text-[10px] text-gray-500 mt-2 font-medium leading-relaxed max-w-[200px]">{WBS_INFO.address}</div>
                            </div>
                            
                            <a href={`mailto:${WBS_INFO.email}`} className="flex flex-col items-center justify-center p-6 bg-white border border-gray-100 rounded-3xl hover:border-blue-500 hover:shadow-xl hover:-translate-y-1 transition-all text-center group">
                                <div className="w-14 h-14 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mb-4 text-2xl group-hover:scale-110 transition-transform shadow-inner">✉️</div>
                                <div className="text-sm font-extrabold text-gray-900 group-hover:text-blue-600">Email Rahasia</div>
                                <div className="text-[11px] text-blue-500 mt-2 font-bold bg-blue-50 px-3 py-1 rounded-full">{WBS_INFO.email}</div>
                            </a>
                            
                            <a href={`https://wa.me/${WBS_INFO.phone.replace(/[^0-9]/g, '')}`} target="_blank" className="flex flex-col items-center justify-center p-6 bg-white border border-gray-100 rounded-3xl hover:border-green-500 hover:shadow-xl hover:-translate-y-1 transition-all text-center group">
                                <div className="w-14 h-14 bg-green-50 text-green-500 rounded-full flex items-center justify-center mb-4 text-2xl group-hover:scale-110 transition-transform shadow-inner">📞</div>
                                <div className="text-sm font-extrabold text-gray-900 group-hover:text-green-600">WhatsApp / Call</div>
                                <div className="text-[11px] text-green-600 mt-2 font-bold bg-green-50 px-3 py-1 rounded-full">{WBS_INFO.phone}</div>
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        function NavButton({ id, active, onClick, icon, label, badge }) {
            return (
                <button onClick={onClick} className={`flex items-center justify-between w-full px-4 py-3 rounded-xl font-bold transition-all duration-200 group ${active ? 'bg-[#f8f9fa] text-gray-900' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900'}`}>
                    <div className="flex items-center">
                        <span className={`mr-3 ${active ? 'text-black' : 'text-gray-400 group-hover:text-black transition-colors'}`}>{icon}</span> 
                        <span className="text-sm">{label}</span>
                    </div>
                    {badge && <span className={`text-[10px] font-extrabold w-5 h-5 flex items-center justify-center rounded-md ${active ? 'bg-gray-200 text-gray-800' : 'bg-transparent text-transparent group-hover:bg-gray-200 group-hover:text-gray-800'}`}>{badge}</span>}
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
