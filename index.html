            Menu: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>,
            X: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            Moon: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>,
            Sun: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Filter: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>,
            Copy: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        };

        const handleLinkClick = (e, url) => {
            if (url === '#' || url === '' || !url) {
                e.preventDefault();
                alert("Fitur ini sedang dalam proses pengerjaan.");
            }
        };

        function App() {
            const [activeView, setActiveView] = useState('home');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [darkMode, setDarkMode] = useState(false);
            const [isEditMode, setIsEditMode] = useState(false);
            const [showAddModal, setShowAddModal] = useState(false);
            const [currentAddSection, setCurrentAddSection] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [passwordError, setPasswordError] = useState('');
            const [editItemData, setEditItemData] = useState(null);
            const [editItemIndex, setEditItemIndex] = useState(null);

            const [dataApps, setDataApps] = useState(INITIAL_APPS);
            const [dataReports, setDataReports] = useState(INITIAL_REPORTS);
            const [dataMonitoring, setDataMonitoring] = useState(INITIAL_MONITORING);
            const [dataDocuments, setDataDocuments] = useState(INITIAL_DOCUMENTS);
            const [dataAccounts, setDataAccounts] = useState(ACCOUNT_DATA);
            const [showAccountModal, setShowAccountModal] = useState(false);
            const [editAccountData, setEditAccountData] = useState(null);
            const [editAccountIndex, setEditAccountIndex] = useState(null);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            const handleMenuClick = (viewId) => {
                setActiveView(viewId);
                setIsMobileMenuOpen(false);
            };

            const handleDelete = (section, index) => {
                if (!confirm("Hapus item ini?")) return;
                if (section === 'apps') setDataApps(prev => prev.filter((_, i) => i !== index));
                else if (section === 'reports') setDataReports(prev => prev.filter((_, i) => i !== index));
                else if (section === 'monitoring') setDataMonitoring(prev => prev.filter((_, i) => i !== index));
                else if (section === 'documents') setDataDocuments(prev => prev.filter((_, i) => i !== index));
            };

            const handleSaveItem = (newItem, section) => {
                const updateArray = (prev) => {
                    if (editItemIndex !== null) {
                        const newArr = [...prev];
                        newArr[editItemIndex] = newItem;
                        return newArr;
                    }
                    return [...prev, newItem];
                };

                if (section === 'apps') setDataApps(prev => updateArray(prev));
                else if (section === 'reports') setDataReports(prev => updateArray(prev));
                else if (section === 'monitoring') setDataMonitoring(prev => updateArray(prev));
                else if (section === 'documents') setDataDocuments(prev => updateArray(prev));
                
                setShowAddModal(false);
                setEditItemData(null);
                setEditItemIndex(null);
            };

            const handleDeleteAccount = (index) => {
                if (!confirm("Hapus akun ini?")) return;
                setDataAccounts(prev => prev.filter((_, i) => i !== index));
            };

            const handleSaveAccount = (newAccount) => {
                if (editAccountIndex !== null) {
                    setDataAccounts(prev => {
                        const newArr = [...prev];
                        newArr[editAccountIndex] = newAccount;
                        return newArr;
                    });
                } else {
                    setDataAccounts(prev => [...prev, newAccount]);
                }
                setShowAccountModal(false);
                setEditAccountData(null);
                setEditAccountIndex(null);
            };

            const openAddAccountModal = () => {
                setEditAccountData(null);
                setEditAccountIndex(null);
                setShowAccountModal(true);
            };

            const openEditAccountModal = (index, account) => {
                setEditAccountData(account);
                setEditAccountIndex(index);
                setShowAccountModal(true);
            };

            const openAddModal = (section) => {
                setCurrentAddSection(section);
                setEditItemData(null);
                setEditItemIndex(null);
                setShowAddModal(true);
            };

            const openEditModal = (section, index, item) => {
                setCurrentAddSection(section);
                setEditItemData(item);
                setEditItemIndex(index);
                setShowAddModal(true);
            };

            const toggleEditMode = () => {
                if (isEditMode) {
                    setIsEditMode(false);
                } else {
                    setShowPasswordModal(true);
                    setPasswordInput('');
                    setPasswordError('');
                }
            };

            const handlePasswordSubmit = (e) => {
                e.preventDefault();
                if (passwordInput === "TAB123") {
                    setIsEditMode(true);
                    setShowPasswordModal(false);
                } else {
                    setPasswordError("Password salah!");
                }
            };

            const renderContent = () => {
                switch(activeView) {
                    case 'home': return <HomeView setActiveView={handleMenuClick} dataApps={dataApps} dataReports={dataReports} dataMonitoring={dataMonitoring} dataDocuments={dataDocuments} />;
                    case 'apps': return <AppsView data={dataApps} dataAccounts={dataAccounts} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('apps')} onDeleteAccount={handleDeleteAccount} onEditAccount={openEditAccountModal} onAddAccount={openAddAccountModal} />;
                    case 'reports': return <ReportsView data={dataReports} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('reports')} />;
                    case 'monitoring': return <MonitoringView data={dataMonitoring} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('monitoring')} />;
                    case 'documents': return <DocumentsView data={dataDocuments} isEditMode={isEditMode} onDelete={handleDelete} onEdit={openEditModal} onAdd={() => openAddModal('documents')} />;
                    case 'wbs': return <WhistleblowingView />;
                    default: return <HomeView setActiveView={handleMenuClick} dataApps={dataApps} dataReports={dataReports} dataMonitoring={dataMonitoring} dataDocuments={dataDocuments} />;
                }
            };

            return (
                <div className="flex flex-col md:flex-row h-screen overflow-hidden relative">
                    <div className="md:hidden flex-shrink-0 sticky top-0 z-40 bg-white dark:bg-dark-card border-b border-gray-200 dark:border-dark-border p-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center">
                            <div className="w-8 h-8 bg-gradient-to-br from-pink-600 to-purple-700 rounded-lg flex items-center justify-center text-white font-bold mr-2">P</div>
                            <h1 className="font-bold text-gray-800 dark:text-gray-100 text-sm">{APP_TITLE}</h1>
                        </div>
                        <button onClick={() => setIsMobileMenuOpen(true)} className="p-2 text-gray-600 dark:text-gray-300 rounded-md">
                            <Icons.Menu />
                        </button>
                    </div>

                    {isMobileMenuOpen && (
                        <div className="fixed inset-0 bg-black/50 z-40 md:hidden backdrop-blur-sm transition-opacity" onClick={() => setIsMobileMenuOpen(false)}></div>
                    )}

                    <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-white dark:bg-dark-card border-r border-gray-200 dark:border-dark-border flex-shrink-0 flex flex-col h-screen transform transition-transform duration-300 md:relative md:translate-x-0 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-4 md:p-6 flex items-center justify-between border-b border-gray-100 dark:border-dark-border">
                            <div className="flex items-center">
                                <div className="w-10 h-10 bg-gradient-to-br from-pink-600 to-purple-700 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-lg mr-3">P</div>
                                <div>
                                    <h1 className="font-bold text-gray-800 dark:text-gray-100 text-sm md:text-base tracking-wide">{APP_TITLE}</h1>
                                    <p className="text-xs text-gray-500 dark:text-gray-400 mt-1 flex items-center font-bold">{APP_SUBTITLE}</p>
                                </div>
                            </div>
                            <button onClick={() => setIsMobileMenuOpen(false)} className="md:hidden p-2 text-gray-600 dark:text-gray-300">
                                <Icons.X />
                            </button>
                        </div>
                        <div className="flex flex-col flex-1 overflow-y-auto bg-white dark:bg-dark-card">
                            <nav className="flex-1 p-4 space-y-2">
                                <div className="px-4 py-2 text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Menu Utama</div>
                                <NavButton id="home" active={activeView === 'home'} onClick={() => handleMenuClick('home')} icon={<Icons.Home />} label="Beranda" />
                                <NavButton id="apps" active={activeView === 'apps'} onClick={() => handleMenuClick('apps')} icon={<Icons.Grid />} label="Aplikasi" />
                                <NavButton id="reports" active={activeView === 'reports'} onClick={() => handleMenuClick('reports')} icon={<Icons.Report />} label="Laporan" />
                                <NavButton id="monitoring" active={activeView === 'monitoring'} onClick={() => handleMenuClick('monitoring')} icon={<Icons.Monitor />} label="Monitoring" />
                                <NavButton id="documents" active={activeView === 'documents'} onClick={() => handleMenuClick('documents')} icon={<Icons.Folder />} label="Dokumen & Arsip" />
                                <NavButton id="wbs" active={activeView === 'wbs'} onClick={() => handleMenuClick('wbs')} icon={<Icons.Warning />} label="Whistleblowing" />
                            </nav>
                            
                            <div className="mt-auto p-4 border-t border-gray-100 dark:border-dark-border bg-gray-50 dark:bg-gray-900">
                                <div className="flex gap-2 mb-4">
                                    <button onClick={() => setDarkMode(!darkMode)} className="flex-1 py-2.5 flex items-center justify-center rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors" title={darkMode ? "Mode Terang" : "Mode Gelap"}>
                                        {darkMode ? <Icons.Sun /> : <Icons.Moon />}
                                    </button>
                                    <button onClick={toggleEditMode} title={isEditMode ? "Selesai Edit" : "Mode Edit"} className={`flex-1 py-2.5 flex items-center justify-center rounded-lg text-lg transition-colors ${isEditMode ? 'bg-pink-600 text-white shadow-md' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'}`}>
                                        {isEditMode ? '✅' : '⚙️'}
                                    </button>
                                </div>
                                <div className="bg-white dark:bg-dark-card p-4 rounded-xl border border-gray-200 dark:border-dark-border shadow-sm relative">
                                    <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">Butuh Bantuan?</p>
                                    <div className="flex items-center mb-3">
                                        <div className="w-8 h-8 bg-gray-200 dark:bg-gray-700 rounded-full flex items-center justify-center text-xs font-bold text-gray-600 dark:text-gray-300 mr-2">GA</div>
                                        <div><p className="text-sm font-bold text-gray-800 dark:text-gray-100">{CONTACT.name}</p><p className="text-[10px] text-gray-500 dark:text-gray-400">{CONTACT.role}</p></div>
                                    </div>
                                    <a href={CONTACT.wa_link} target="_blank" className="block w-full text-center py-2 bg-green-500 hover:bg-green-600 text-white text-xs font-bold rounded-lg transition-colors shadow-sm">Chat WhatsApp</a>
                                </div>
                            </div>
                        </div>
                    </aside>
                    
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto scroll-smooth w-full md:w-auto relative">
                        {isEditMode && (
                            <div className="bg-pink-100 dark:bg-pink-900/30 border border-pink-300 dark:border-pink-800 text-pink-800 dark:text-pink-300 px-4 py-3 rounded-lg mb-6 flex items-center shadow-sm">
                                <span className="mr-3 text-xl">🛠️</span>
                                <div>
                                    <h4 className="font-bold text-sm">Mode Edit Aktif</h4>
                                    <p className="text-xs">Kamu bisa menambah atau menghapus tombol pada menu Aplikasi, Laporan, dan Monitoring.</p>
                                </div>
                            </div>
                        )}
                        {renderContent()}
                        <footer className="text-center text-gray-400 text-xs py-6 mt-8 border-t border-gray-200 dark:border-dark-border">
                            &copy; 2026 {APP_TITLE} {APP_SUBTITLE}. Developed by {CONTACT.name}.
                        </footer>
                    </main>

                    {showAddModal && <AddModal section={currentAddSection} onClose={() => setShowAddModal(false)} onSave={handleSaveItem} initialData={editItemData} />}

                    {showPasswordModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
                            <div className="bg-white dark:bg-dark-card w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden fade-in">
                                <div className="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                                    <h3 className="font-bold text-lg text-gray-800 dark:text-gray-100">Keamanan</h3>
                                    <button onClick={() => setShowPasswordModal(false)} className="text-gray-500 hover:text-gray-800 dark:hover:text-white"><Icons.X /></button>
                                </div>
                                <form onSubmit={handlePasswordSubmit} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Masukkan Password Edit</label>
                                        <input 
                                            type="password" 
                                            autoFocus
                                            value={passwordInput} 
                                            onChange={e => setPasswordInput(e.target.value)} 
                                            className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500" 
                                            placeholder="******" 
                                        />
                                        {passwordError && <p className="text-red-500 text-xs mt-1 font-bold">{passwordError}</p>}
                                    </div>
                                    <div className="pt-2 flex gap-3">
                                        <button type="button" onClick={() => setShowPasswordModal(false)} className="flex-1 py-2 px-4 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition">Batal</button>
                                        <button type="submit" className="flex-1 py-2 px-4 bg-pink-600 text-white font-bold rounded-lg hover:bg-pink-700 transition">Verifikasi</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showAccountModal && (
                        <AccountModal 
                            onClose={() => setShowAccountModal(false)} 
                            onSave={handleSaveAccount} 
                            initialData={editAccountData} 
                            existingApps={[...new Set(dataAccounts.map(r => r.app).filter(Boolean))]} 
                        />
                    )}
                </div>
            );
        }

        function AddButtonPlaceholder({ onClick, title }) {
            return (
                <button onClick={onClick} className="h-full min-h-[160px] flex flex-col items-center justify-center border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-2xl bg-gray-50/50 dark:bg-gray-800/50 hover:bg-pink-50 hover:border-pink-300 dark:hover:bg-pink-900/20 dark:hover:border-pink-700 transition-colors group">
                    <div className="w-12 h-12 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center text-gray-400 group-hover:text-pink-500 group-hover:scale-110 transition-transform shadow-sm mb-3">
                        <Icons.Plus />
                    </div>
                    <span className="text-sm font-bold text-gray-500 dark:text-gray-400 group-hover:text-pink-600">{title || "Tambah Tombol"}</span>
                </button>
            );
        }

        function HomeView({ setActiveView, dataApps, dataReports, dataMonitoring, dataDocuments }) {
            return (
                <div className="fade-in space-y-6 md:space-y-8">
                    <header className="mb-6 md:mb-8">
                        <h2 className="text-2xl md:text-3xl font-bold text-gray-800 dark:text-gray-100 mb-3">Halo, {USER_NAME} 👋</h2>
                        <div className="bg-white dark:bg-dark-card border-l-4 border-pink-500 p-4 rounded-r-lg shadow-sm">
                            <p className="text-gray-700 dark:text-gray-300 italic text-sm md:text-lg mb-4">"Ingat, hasil besar dimulai dari langkah kecil yang tak terputus. Kesuksesan bukan soal kecepatan, tapi soal ketahanan."</p>
                        </div>
                    </header>
                    <div className="bg-gradient-to-r from-purple-700 to-pink-600 rounded-2xl p-6 md:p-8 text-white shadow-xl relative overflow-hidden">
                        <div className="relative z-10">
                            <h3 className="text-xl md:text-2xl font-bold mb-2 flex items-center"><span className="mr-2">🚀</span> {APP_TITLE} {APP_SUBTITLE}</h3>
                            <p className="opacity-95 text-sm md:text-base max-w-3xl mb-6">Pusat akses tunggal kebutuhan operasional tim. Buka aplikasi, pantau laporan, dokumen SOP, dan project dengan cepat.</p>
                            <button onClick={() => setActiveView('apps')} className="w-full sm:w-auto px-6 py-2.5 bg-white text-purple-700 font-bold rounded-lg shadow-lg hover:bg-gray-50 transition-transform transform hover:-translate-y-0.5">Mulai Akses Aplikasi</button>
                        </div>
                    </div>

                    <div>
                        <h3 className="font-bold text-gray-700 dark:text-gray-200 mb-4 flex items-center"><span className="w-1.5 h-6 bg-gray-400 rounded-full mr-3"></span>Statistik Menu Pintas</h3>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 md:gap-4">
                            <div onClick={() => setActiveView('apps')} className="bg-white dark:bg-dark-card p-4 md:p-5 rounded-xl border border-gray-200 dark:border-dark-border shadow-sm hover:border-pink-300 cursor-pointer transition-all hover:-translate-y-1 group">
                                <div className="w-8 h-8 md:w-10 md:h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center mb-2 md:mb-3 group-hover:bg-blue-600 group-hover:text-white transition-colors"><Icons.Grid /></div>
                                <h4 className="font-bold text-sm md:text-base text-gray-800 dark:text-gray-100">Aplikasi</h4><p className="text-[10px] md:text-xs text-gray-500 dark:text-gray-400">{dataApps.length} Apps Tersedia</p>
                            </div>
                            <div onClick={() => setActiveView('reports')} className="bg-white dark:bg-dark-card p-4 md:p-5 rounded-xl border border-gray-200 dark:border-dark-border shadow-sm hover:border-pink-300 cursor-pointer transition-all hover:-translate-y-1 group">
                                <div className="w-8 h-8 md:w-10 md:h-10 bg-green-100 text-green-600 rounded-lg flex items-center justify-center mb-2 md:mb-3 group-hover:bg-green-600 group-hover:text-white transition-colors"><Icons.Report /></div>
                                <h4 className="font-bold text-sm md:text-base text-gray-800 dark:text-gray-100">Laporan</h4><p className="text-[10px] md:text-xs text-gray-500 dark:text-gray-400">{dataReports.length} Laporan</p>
                            </div>
                            <div onClick={() => setActiveView('monitoring')} className="bg-white dark:bg-dark-card p-4 md:p-5 rounded-xl border border-gray-200 dark:border-dark-border shadow-sm hover:border-pink-300 cursor-pointer transition-all hover:-translate-y-1 group">
                                <div className="w-8 h-8 md:w-10 md:h-10 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center mb-2 md:mb-3 group-hover:bg-indigo-600 group-hover:text-white transition-colors"><Icons.Monitor /></div>
                                <h4 className="font-bold text-sm md:text-base text-gray-800 dark:text-gray-100">Monitoring</h4><p className="text-[10px] md:text-xs text-gray-500 dark:text-gray-400">{dataMonitoring.length} Dasbor</p>
                            </div>
                            <div onClick={() => setActiveView('documents')} className="bg-white dark:bg-dark-card p-4 md:p-5 rounded-xl border border-gray-200 dark:border-dark-border shadow-sm hover:border-pink-300 cursor-pointer transition-all hover:-translate-y-1 group">
                                <div className="w-8 h-8 md:w-10 md:h-10 bg-yellow-100 text-yellow-600 rounded-lg flex items-center justify-center mb-2 md:mb-3 group-hover:bg-yellow-600 group-hover:text-white transition-colors"><Icons.Folder /></div>
                                <h4 className="font-bold text-sm md:text-base text-gray-800 dark:text-gray-100">Dokumen</h4><p className="text-[10px] md:text-xs text-gray-500 dark:text-gray-400">{dataDocuments.length} Dokumen</p>
                            </div>
                            <div onClick={() => setActiveView('wbs')} className="bg-white dark:bg-dark-card p-4 md:p-5 rounded-xl border border-gray-200 dark:border-dark-border shadow-sm hover:border-pink-300 cursor-pointer transition-all hover:-translate-y-1 group">
                                <div className="w-8 h-8 md:w-10 md:h-10 bg-red-100 text-red-600 rounded-lg flex items-center justify-center mb-2 md:mb-3 group-hover:bg-red-600 group-hover:text-white transition-colors"><Icons.Warning /></div>
                                <h4 className="font-bold text-sm md:text-base text-gray-800 dark:text-gray-100">WBS</h4><p className="text-[10px] md:text-xs text-gray-500 dark:text-gray-400">Lapor Pelanggaran</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AddModal({ section, onClose, onSave, initialData }) {
            const [name, setName] = useState(initialData ? initialData.name : '');
            const [desc, setDesc] = useState(initialData ? initialData.desc : '');
            const [icon, setIcon] = useState(initialData ? initialData.icon : '📌');
            const [color, setColor] = useState(initialData ? initialData.color : 'from-blue-500 to-blue-600');
            const [category, setCategory] = useState(initialData && initialData.category ? initialData.category : (section === 'reports' ? 'Daily' : 'SOP & Panduan Operasional'));

            const defaultLinks = [{label: 'Buka', url: ''}, {label: '', url: ''}, {label: '', url: ''}];
            if (initialData) {
                if (initialData.links && initialData.links.length > 0) {
                    for (let i = 0; i < initialData.links.length; i++) {
                        if(i < 3) defaultLinks[i] = initialData.links[i];
                    }
                } else if (initialData.url) {
                    defaultLinks[0] = {label: 'Buka', url: initialData.url};
                }
            }
            const [links, setLinks] = useState(defaultLinks);

            const handleLinkChange = (index, field, value) => {
                const newLinks = [...links];
                newLinks[index][field] = value;
                setLinks(newLinks);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const validLinks = links.filter(l => l.url.trim() !== '');
                const newItem = { name, desc, icon, color };
                
                if (validLinks.length > 1 || (validLinks.length === 1 && validLinks[0].label !== 'Buka')) {
                    newItem.links = validLinks;
                    newItem.url = validLinks[0].url;
                } else if (validLinks.length === 1) {
                    newItem.url = validLinks[0].url;
                } else {
                    newItem.url = '#';
                }

                if (section === 'reports' || section === 'documents') newItem.category = category;
                onSave(newItem, section);
            };

            const colors = [
                { id: 'from-blue-500 to-blue-600', name: 'Biru' },
                { id: 'from-green-500 to-green-600', name: 'Hijau' },
                { id: 'from-red-500 to-red-600', name: 'Merah' },
                { id: 'from-orange-500 to-orange-600', name: 'Oranye' },
                { id: 'from-purple-500 to-purple-600', name: 'Ungu' },
                { id: 'from-pink-500 to-pink-600', name: 'Pink' },
            ];

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
                    <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl overflow-hidden fade-in">
                        <div className="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                            <h3 className="font-bold text-lg text-gray-800 dark:text-gray-100">{initialData ? 'Edit Tombol' : 'Tambah Tombol Baru'}</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800 dark:hover:text-white"><Icons.X /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Nama Tombol</label>
                                <input required type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white" placeholder="Contoh: Laporan Bulanan" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Tautan / Tombol (Maksimal 3)</label>
                                <div className="space-y-2">
                                    {[0, 1, 2].map(i => (
                                        <div key={i} className="flex gap-2">
                                            <input type="text" value={links[i].label} onChange={e => handleLinkChange(i, 'label', e.target.value)} className="w-1/3 px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-xs" placeholder={`Label ${i+1}`} />
                                            <input type="text" value={links[i].url} onChange={e => handleLinkChange(i, 'url', e.target.value)} className="w-2/3 px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-xs" placeholder={`URL ${i+1} (https://...)`} />
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Ikon (Emoji/Teks Singkat)</label>
                                    <input required type="text" value={icon} onChange={e => setIcon(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white" maxLength="3" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Warna</label>
                                    <select value={color} onChange={e => setColor(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white">
                                        {colors.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                            </div>
                            {section === 'reports' && (
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Kategori Laporan</label>
                                    <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white">
                                        <option value="Daily">Daily Ops</option>
                                        <option value="Inbound">Inbound</option>
                                        <option value="Outbound">Outbound</option>
                                        <option value="Handover">Handover</option>
                                    </select>
                                </div>
                            )}
                            {section === 'documents' && (
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Kategori Dokumen</label>
                                    <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white">
                                        <option value="Program & Kompetisi">Program & Kompetisi</option>
                                        <option value="Project & Improvement">Project & Improvement</option>
                                        <option value="SOP & Panduan Operasional">SOP & Panduan Operasional</option>
                                    </select>
                                </div>
                            )}
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Deskripsi Singkat</label>
                                <textarea value={desc} onChange={e => setDesc(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white" rows="2" placeholder="Penjelasan isi tombol..."></textarea>
                            </div>
                            <div className="pt-4 flex gap-3">
                                <button type="button" onClick={onClose} className="flex-1 py-2 px-4 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition">Batal</button>
                                <button type="submit" className="flex-1 py-2 px-4 bg-pink-600 text-white font-bold rounded-lg hover:bg-pink-700 transition">Simpan Tombol</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function AccountModal({ onClose, onSave, initialData, existingApps }) {
            const [user, setUser] = useState(initialData ? initialData.user : '');
            const [pass, setPass] = useState(initialData ? initialData.pass : '');
            const [appSelection, setAppSelection] = useState(initialData ? initialData.app : '');
            const [customApp, setCustomApp] = useState('');
            const [hub, setHub] = useState(initialData ? initialData.hub : '');
            const [rute, setRute] = useState(initialData ? initialData.rute : '');

            const handleSubmit = (e) => {
                e.preventDefault();
                const finalApp = appSelection === 'Lainnya' ? customApp : appSelection;
                onSave({ user, pass, app: finalApp, hub, rute });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
                    <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl overflow-hidden fade-in">
                        <div className="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                            <h3 className="font-bold text-lg text-gray-800 dark:text-gray-100">{initialData ? 'Edit Akun' : 'Tambah Akun Baru'}</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800 dark:hover:text-white"><Icons.X /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Username</label>
                                    <input required type="text" value={user} onChange={e => setUser(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Password</label>
                                    <input required type="text" value={pass} onChange={e => setPass(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Aplikasi</label>
                                <select value={appSelection} onChange={e => setAppSelection(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm mb-2" required>
                                    <option value="">Pilih Aplikasi</option>
                                    {existingApps.map(a => <option key={a} value={a}>{a}</option>)}
                                    <option value="Lainnya">Tambah Baru (Lainnya)</option>
                                </select>
                                {appSelection === 'Lainnya' && (
                                    <input required type="text" value={customApp} onChange={e => setCustomApp(e.target.value)} placeholder="Masukkan Nama Aplikasi Baru" className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm" />
                                )}
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">HUB</label>
                                    <input required type="text" value={hub} onChange={e => setHub(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm" placeholder="Contoh: MKS" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Rute</label>
                                    <input type="text" value={rute} onChange={e => setRute(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-white text-sm" placeholder="Kosongkan jika tidak ada" />
                                </div>
                            </div>
                            <div className="pt-4 flex gap-3">
                                <button type="button" onClick={onClose} className="flex-1 py-2 px-4 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition">Batal</button>
                                <button type="submit" className="flex-1 py-2 px-4 bg-pink-600 text-white font-bold rounded-lg hover:bg-pink-700 transition">Simpan Akun</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ItemCard({ item, isEditMode, onDelete, onEdit }) {
            const hasMultipleLinks = item.links && item.links.length > 0;
            const useGridLayout = (hasMultipleLinks && item.links.length > 4) || item.fullWidthFirst;
            
            const cardClass = `group block bg-white dark:bg-dark-card rounded-2xl p-4 md:p-6 border shadow-sm hover:shadow-xl transition-all relative overflow-hidden flex flex-col h-full ${!item.url || item.url === '#' ? 'border-orange-200 hover:border-orange-400' : 'border-gray-100 dark:border-dark-border hover:border-pink-200'}`;

            return (
                <div className="relative h-full">
                    {isEditMode && (
                        <div className="absolute -top-2 -right-2 z-20 flex gap-1">
                            <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); onEdit(); }} className="w-8 h-8 bg-blue-500 text-white rounded-full flex items-center justify-center shadow-md hover:bg-blue-600 hover:scale-110 transition-transform">
                                <Icons.Edit />
                            </button>
                            <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); onDelete(); }} className="w-8 h-8 bg-red-500 text-white rounded-full flex items-center justify-center shadow-md hover:bg-red-600 hover:scale-110 transition-transform">
                                <Icons.Trash />
                            </button>
                        </div>
                    )}
                    
                    {hasMultipleLinks ? (
                        <div className={cardClass}>
                            <div className={`absolute top-0 right-0 w-24 h-24 bg-gradient-to-br ${item.color || 'from-gray-400 to-gray-500'} opacity-10 rounded-bl-full -mr-4 -mt-4 transition-all group-hover:scale-150`}></div>
                            <div className={`w-12 h-12 md:w-14 md:h-14 rounded-xl bg-gradient-to-br ${item.color || 'from-gray-400 to-gray-500'} flex items-center justify-center text-white font-bold text-lg md:text-xl mb-4 shadow-md`}>
                                {item.icon}
                            </div>
                            <h4 className="text-base md:text-lg font-bold text-gray-800 dark:text-gray-100 mb-3 group-hover:text-pink-600 transition-colors line-clamp-2">{item.name}</h4>
                            {item.desc && <p className="text-xs text-gray-500 dark:text-gray-400 mb-3">{item.desc}</p>}
                            <div className={`relative z-10 ${useGridLayout ? 'grid grid-cols-1 sm:grid-cols-2 gap-2' : 'space-y-2'}`}>
                                {item.links.map((link, idx) => {
                                    const isLinkEmpty = link.url === '#' || !link.url;
                                    return (
                                        <a key={idx} href={link.url} target={isLinkEmpty ? '_self' : '_blank'} onClick={(e) => handleLinkClick(e, link.url)} className={`flex items-center justify-between px-3 py-2 rounded-lg text-xs font-bold border transition-colors ${isLinkEmpty ? 'bg-orange-50 text-orange-600 border-orange-100 cursor-pointer' : 'bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-100 dark:border-dark-border hover:bg-pink-50 hover:text-pink-600'}`}>
                                            <span className="truncate mr-1">{link.label}</span>
                                            {isLinkEmpty ? <Icons.Warning /> : <Icons.External />}
                                        </a>
                                    )
                                })}
                            </div>
                        </div>
                    ) : (
                        <a href={item.url} target={!item.url || item.url === '#' ? '_self' : '_blank'} onClick={(e) => handleLinkClick(e, item.url)} className={cardClass}>
                            <div className={`absolute top-0 right-0 w-24 h-24 bg-gradient-to-br ${item.color || 'from-gray-400 to-gray-500'} opacity-10 rounded-bl-full -mr-4 -mt-4 transition-all group-hover:scale-150`}></div>
                            <div className={`w-12 h-12 md:w-14 md:h-14 rounded-xl bg-gradient-to-br ${item.color || 'from-gray-400 to-gray-500'} flex items-center justify-center text-white font-bold text-lg md:text-xl mb-4 shadow-md`}>
                                {item.icon}
                            </div>
                            <div className="flex-1">
                                <h4 className="text-base md:text-lg font-bold text-gray-800 dark:text-gray-100 mb-1 group-hover:text-pink-600 transition-colors line-clamp-2">{item.name}</h4>
                                <p className="text-xs md:text-sm text-gray-500 dark:text-gray-400 mb-4 h-10 overflow-hidden line-clamp-2">{item.desc || 'Klik untuk akses'}</p>
                            </div>
                            <div className="flex items-center text-xs font-bold uppercase tracking-wider mt-auto text-gray-400 group-hover:text-pink-500">
                                <span className="flex items-center">Buka <span className="ml-2"><Icons.External /></span></span>
                            </div>
                        </a>
                    )}
                </div>
            );
        }

        function AppsView({ data, dataAccounts, isEditMode, onDelete, onEdit, onAdd, onDeleteAccount, onEditAccount, onAddAccount }) {
            const [searchQuery, setSearchQuery] = useState("");
            const [filterAppType, setFilterAppType] = useState('All');
            const [filterHub, setFilterHub] = useState('All');

            const filteredApps = data.filter(app => 
                app.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                (app.desc && app.desc.toLowerCase().includes(searchQuery.toLowerCase()))
            );

            const uniqueHubs = ['All', ...new Set(dataAccounts.map(r => r.hub).filter(Boolean))].sort();
            const uniqueApps = ['All', ...new Set(dataAccounts.map(r => r.app).filter(Boolean))].sort();

            const filteredRiders = dataAccounts.filter(rider => {
                const matchSearch = rider.user.includes(searchQuery) || 
                                    (rider.hub && rider.hub.toLowerCase().includes(searchQuery.toLowerCase())) ||
                                    (rider.rute && rider.rute.toLowerCase().includes(searchQuery.toLowerCase()));
                const matchApp = filterAppType === 'All' || rider.app === filterAppType;
                const matchHub = filterHub === 'All' || rider.hub === filterHub;

                return matchSearch && matchApp && matchHub;
            });

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                alert("Disalin: " + text);
            };

            return (
                <div className="fade-in">
                    <div className="mb-6 border-b border-gray-200 dark:border-dark-border pb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                         <div>
                            <h2 className="text-xl md:text-2xl font-bold text-gray-800 dark:text-gray-100">Aplikasi Internal</h2>
                            <p className="text-sm md:text-base text-gray-500 dark:text-gray-400">Akses aplikasi dan tool pendukung.</p>
                        </div>
                         <div className="relative w-full md:w-auto">
                            <input type="text" placeholder="Cari aplikasi..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full md:w-72 pl-8 pr-4 py-2 border rounded-lg text-sm bg-gray-50 dark:bg-gray-800 dark:border-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500" />
                            <div className="absolute left-2.5 top-2.5 text-gray-400"><Icons.Grid className="w-4 h-4" /></div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-6 mb-8">
                        {filteredApps.map((app, idx) => (
                            <ItemCard key={idx} item={app} isEditMode={isEditMode} onDelete={() => onDelete('apps', idx)} onEdit={() => onEdit('apps', idx, app)} />
                        ))}
                        {isEditMode && <AddButtonPlaceholder onClick={onAdd} title="Tambah Aplikasi" />}
                    </div>

                    <div className="bg-white dark:bg-dark-card rounded-xl border border-gray-200 dark:border-dark-border shadow-sm overflow-hidden">
                        <div className="p-4 border-b border-gray-200 dark:border-dark-border bg-gray-50 dark:bg-gray-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <h3 className="font-bold text-gray-800 dark:text-gray-100 flex items-center text-sm md:text-base">
                                <span className="mr-2">👤</span> Akun Tim
                            </h3>
                            
                            <div className="flex flex-row sm:flex-row gap-2 w-full md:w-auto">
                                {isEditMode && (
                                    <button onClick={onAddAccount} className="bg-pink-600 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-pink-700 shadow-sm whitespace-nowrap">
                                        + Tambah Akun
                                    </button>
                                )}
                                <div className="relative w-1/2 sm:w-auto">
                                    <select 
                                        value={filterAppType} 
                                        onChange={(e) => setFilterAppType(e.target.value)}
                                        className="appearance-none w-full bg-white dark:bg-dark-card border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-300 py-2 pl-3 pr-8 rounded-lg text-xs font-bold focus:outline-none focus:ring-2 focus:ring-pink-500"
                                    >
                                        {uniqueApps.map(app => <option key={app} value={app}>{app === 'All' ? 'Semua App' : app}</option>)}
                                    </select>
                                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500"><Icons.Filter /></div>
                                </div>

                                <div className="relative w-1/2 sm:w-auto">
                                    <select 
                                        value={filterHub} 
                                        onChange={(e) => setFilterHub(e.target.value)}
                                        className="appearance-none w-full bg-white dark:bg-dark-card border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-300 py-2 pl-3 pr-8 rounded-lg text-xs font-bold focus:outline-none focus:ring-2 focus:ring-pink-500"
                                    >
                                        {uniqueHubs.map(hub => <option key={hub} value={hub}>{hub === 'All' ? 'Semua HUB' : hub}</option>)}
                                    </select>
                                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500"><Icons.Filter /></div>
                                </div>
                            </div>
                        </div>

                        <div className="overflow-x-auto custom-scrollbar">
                            <table className="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                                <thead className="text-xs text-gray-700 uppercase bg-gray-100 dark:bg-gray-700 dark:text-gray-300 sticky-header">
                                    <tr>
                                        <th className="px-4 py-3 bg-gray-100 dark:bg-gray-700 whitespace-nowrap">Username</th>
                                        <th className="px-4 py-3 bg-gray-100 dark:bg-gray-700 whitespace-nowrap">Password</th>
                                        <th className="px-4 py-3 bg-gray-100 dark:bg-gray-700 whitespace-nowrap">App</th>
                                        <th className="px-4 py-3 bg-gray-100 dark:bg-gray-700 whitespace-nowrap">HUB</th>
                                        <th className="px-4 py-3 bg-gray-100 dark:bg-gray-700 whitespace-nowrap">Rute</th>
                                        {isEditMode && <th className="px-4 py-3 bg-gray-100 dark:bg-gray-700 whitespace-nowrap">Aksi</th>}
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredRiders.length > 0 ? (
                                        filteredRiders.map((rider, index) => {
                                            const actualIndex = dataAccounts.findIndex(acc => acc === rider);
                                            return (
                                            <tr key={index} className="bg-white border-b dark:bg-dark-card dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                                                <td className="px-4 py-3 font-medium text-gray-900 dark:text-white whitespace-nowrap">
                                                    <div className="flex items-center justify-between">
                                                        {rider.user}
                                                        <button onClick={() => copyToClipboard(rider.user)} className="text-gray-400 hover:text-pink-500 ml-3" title="Copy User"><Icons.Copy /></button>
                                                    </div>
                                                </td>
                                                <td className="px-4 py-3 font-mono text-xs whitespace-nowrap">
                                                     <div className="flex items-center justify-between">
                                                        {rider.pass}
                                                        <button onClick={() => copyToClipboard(rider.pass)} className="text-gray-400 hover:text-pink-500 ml-3" title="Copy Pass"><Icons.Copy /></button>
                                                    </div>
                                                </td>
                                                <td className="px-4 py-3 whitespace-nowrap"><span className="bg-pink-100 text-pink-800 text-xs font-medium px-2 py-0.5 rounded dark:bg-pink-900 dark:text-pink-300">{rider.app}</span></td>
                                                <td className="px-4 py-3 font-bold whitespace-nowrap">{rider.hub}</td>
                                                <td className="px-4 py-3 text-xs whitespace-nowrap">{rider.rute || "-"}</td>
                                                {isEditMode && (
                                                    <td className="px-4 py-3 whitespace-nowrap">
                                                        <div className="flex gap-2">
                                                            <button onClick={() => onEditAccount(actualIndex, rider)} className="text-blue-500 hover:text-blue-700"><Icons.Edit /></button>
                                                            <button onClick={() => onDeleteAccount(actualIndex)} className="text-red-500 hover:text-red-700"><Icons.Trash /></button>
                                                        </div>
                                                    </td>
                                                )}
                                            </tr>
                                        )})
                                    ) : (
                                        <tr>
                                            <td colSpan={isEditMode ? "6" : "5"} className="px-6 py-8 text-center text-gray-400">
                                                Data akun tidak ditemukan.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-3 bg-gray-50 dark:bg-gray-800 text-center text-[10px] text-gray-400 font-medium">
                            Menampilkan {filteredRiders.length} dari {dataAccounts.length} Akun
                        </div>
                    </div>
                </div>
            );
        }

        function ReportsView({ data, isEditMode, onDelete, onEdit, onAdd }) {
            const categories = ['Daily', 'Inbound', 'Outbound', 'Handover'];
            
            return (
                <div className="fade-in space-y-8 md:space-y-10">
                    <div className="mb-4 md:mb-6 border-b border-gray-200 dark:border-dark-border pb-4 flex justify-between items-center">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-gray-800 dark:text-gray-100">Laporan & Kinerja</h2>
                            <p className="text-sm md:text-base text-gray-500 dark:text-gray-400">Akses data laporan operasional.</p>
                        </div>
                        {isEditMode && <button onClick={onAdd} className="bg-pink-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-pink-700 shadow-sm">+ Tambah Baru</button>}
                    </div>
                    
                    {categories.map(cat => {
                        const items = data.filter(r => r.category === cat);
                        if (items.length === 0 && !isEditMode) return null;
                        
                        return (
                            <div key={cat}>
                                <h3 className="text-base md:text-lg font-bold text-gray-700 dark:text-gray-200 mb-4 flex items-center"><span className="w-1.5 h-6 bg-blue-600 rounded-full mr-3"></span>Kategori: {cat}</h3>
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4">
                                    {items.map((item, idx) => <ItemCard key={idx} item={item} isEditMode={isEditMode} onDelete={() => {
                                        const actualIndex = data.findIndex(d => d === item);
                                        onDelete('reports', actualIndex);
                                    }} onEdit={() => {
                                        const actualIndex = data.findIndex(d => d === item);
                                        onEdit('reports', actualIndex, item);
                                    }} />)}
                                    {isEditMode && items.length === 0 && <div className="col-span-full text-sm text-gray-400 italic">Belum ada item di kategori ini. Klik Tambah Baru di atas.</div>}
                                </div>
                            </div>
                        )
                    })}
                </div>
            );
        }

        function MonitoringView({ data, isEditMode, onDelete, onEdit, onAdd }) {
            return (
                <div className="fade-in">
                    <div className="mb-4 md:mb-6 border-b border-gray-200 dark:border-dark-border pb-4">
                        <h2 className="text-xl md:text-2xl font-bold text-gray-800 dark:text-gray-100">Monitoring</h2>
                        <p className="text-sm md:text-base text-gray-500 dark:text-gray-400">Pantau pergerakan paket dan kinerja HUB.</p>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4">
                        {data.map((item, idx) => (
                            <ItemCard key={idx} item={item} isEditMode={isEditMode} onDelete={() => onDelete('monitoring', idx)} onEdit={() => onEdit('monitoring', idx, item)} />
                        ))}
                        {isEditMode && <AddButtonPlaceholder onClick={onAdd} title="Tambah Monitoring" />}
                    </div>
                </div>
            );
        }

        function DocumentsView({ data, isEditMode, onDelete, onEdit, onAdd }) {
            const categories = ['Program & Kompetisi', 'Project & Improvement', 'SOP & Panduan Operasional'];

            return (
                <div className="fade-in space-y-8 md:space-y-10">
                    <div className="mb-4 md:mb-6 border-b border-gray-200 dark:border-dark-border pb-4 flex justify-between items-center">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-gray-800 dark:text-gray-100">Dokumen & Arsip</h2>
                            <p className="text-sm md:text-base text-gray-500 dark:text-gray-400">Pusat penyimpanan dokumen, panduan, dan materi training.</p>
                        </div>
                        {isEditMode && <button onClick={onAdd} className="bg-pink-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-pink-700 shadow-sm">+ Tambah Dokumen</button>}
                    </div>

                    {categories.map(cat => {
                        const items = data.filter(d => d.category === cat);
                        if (items.length === 0 && !isEditMode) return null;

                        return (
                            <div key={cat}>
                                <h3 className="text-base md:text-lg font-bold text-gray-700 dark:text-gray-200 mb-4 flex items-center">
                                    <span className="w-1.5 h-6 bg-gray-500 rounded-full mr-3"></span>
                                    {cat}
                                </h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4">
                                    {items.map((item, idx) => (
                                        <ItemCard key={idx} item={item} isEditMode={isEditMode} onDelete={() => {
                                            const actualIndex = data.findIndex(d => d === item);
                                            onDelete('documents', actualIndex);
                                        }} onEdit={() => {
                                            const actualIndex = data.findIndex(d => d === item);
                                            onEdit('documents', actualIndex, item);
                                        }} />
                                    ))}
                                    {isEditMode && items.length === 0 && <div className="col-span-full text-sm text-gray-400 italic">Belum ada dokumen di kategori ini.</div>}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        function WhistleblowingView() {
            return (
                <div className="fade-in">
                    <div className="bg-white dark:bg-dark-card rounded-2xl border border-gray-200 dark:border-dark-border shadow-sm overflow-hidden mb-8">
                        <div className="bg-gradient-to-r from-gray-800 to-gray-900 p-6 md:p-12 text-center relative overflow-hidden">
                            <div className="relative z-10">
                                <h2 className="text-2xl md:text-4xl font-extrabold text-white mb-3 tracking-tight">BERANI LAPOR HEBAT!</h2>
                                <p className="text-gray-300 text-sm md:text-lg font-medium max-w-2xl mx-auto mb-6">Laporkan jika Anda melihat Pelanggaran, Kecurangan, dan Penyimpangan.</p>
                                <a href={WBS_INFO.formLink} target="_blank" className="inline-block px-8 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow-lg">Buat Laporan Sekarang</a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function NavButton({ id, active, onClick, icon, label }) {
            return (
                <button onClick={onClick} className={`flex items-center w-full px-4 py-3 rounded-lg font-medium transition-all duration-200 ${active ? 'bg-pink-50 dark:bg-gray-800 text-pink-700 dark:text-pink-400 shadow-sm translate-x-1' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100'}`}>
                    <span className={`mr-3 ${active ? 'text-pink-600 dark:text-pink-400' : 'text-gray-400 dark:text-gray-500'}`}>{icon}</span> {label}
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
