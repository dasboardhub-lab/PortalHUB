            Grid: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>,

            Monitor: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>,

            Moon: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>,
            Sun: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Filter: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>,
            Copy: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>,
            Check: () => <svg className="w-4 h-4 text-green-500 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>,
            Calendar: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>,
            MoreDots: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>,
            Phone: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>,
            Video: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>,
            Info: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            Logout: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
            Send: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>,
            Login: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>,
            Lock: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Photograph: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        };

        function CustomModal({ config }) {
            if (!config.isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm fade-in">
                    <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden transform transition-all">
                        <div className="p-6 text-center border-b border-gray-100">
                            <div className={`w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 ${config.type === 'confirm' ? 'bg-red-50 text-red-500' : 'bg-blue-50 text-blue-500'}`}>
                                {config.type === 'confirm' ? <Icons.Warning /> : <Icons.Info />}
                            </div>
                            <h3 className="text-xl font-extrabold text-gray-900 mb-2">{config.title}</h3>
                            <p className="text-sm text-gray-500">{config.message}</p>
                        </div>
                        <div className="p-4 bg-gray-50 flex gap-3 justify-center">
                            {config.type === 'confirm' && (
                                <button onClick={config.onCancel} className="flex-1 py-3 px-4 bg-white border border-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-100 transition-colors shadow-sm text-sm">Batal</button>
                            )}
                            <button onClick={config.onConfirm} className={`flex-1 py-3 px-4 font-bold rounded-xl text-white transition-colors shadow-md text-sm ${config.type === 'confirm' ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                {config.type === 'confirm' ? 'Lanjutkan' : 'Mengerti'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }
        
        function RightPanel({ firebaseDb, appId, isEditMode, setIsEditMode, isAdminLoggedIn, setIsAdminLoggedIn, adminAuth, saveToCloud, loggedInUser, setLoggedInUser, dataWebUsers, setDataWebUsers, showConfirm }) {
            const { useState, useEffect, useRef } = React;
            const [messages, setMessages] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [editingMsgId, setEditingMsgId] = useState(null);
            const [editMsgText, setEditMsgText] = useState('');
            const [showLogin, setShowLogin] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [loginId, setLoginId] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [newAdminId, setNewAdminId] = useState('');
            const [newAdminPass, setNewAdminPass] = useState('');
            
            const [newWebUser, setNewWebUser] = useState('');
            const [newWebPass, setNewWebPass] = useState('');

            const messagesEndRef = useRef(null);

            useEffect(() => {
                if (!firebaseDb) return;
                const messagesRef = firebaseDb.collection('artifacts').doc(appId).collection('public').doc('data').collection('messages');
                
                const unsubscribe = messagesRef.onSnapshot((snapshot) => {
                    const msgs = [];
                    snapshot.forEach((doc) => {
                        msgs.push({ id: doc.id, ...doc.data() });
                    });
                    msgs.sort((a, b) => a.timestamp - b.timestamp);
                    setMessages(msgs);
                }, (error) => {
                    console.error("Error fetching messages:", error);
                });

                return () => unsubscribe();
            }, [firebaseDb, appId]);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (loginId === adminAuth.id && loginPass === adminAuth.pass) {
                    setIsAdminLoggedIn(true);
                    setLoggedInUser({ user: "Admin" });
                    setShowLogin(false);
                    setLoginId('');
                    setLoginPass('');
                    setLoginError('');
                } else {
                    const userMatch = dataWebUsers?.find(u => u.user === loginId && u.pass === loginPass);
                    if (userMatch) {
                        setIsAdminLoggedIn(false);
                        setLoggedInUser(userMatch);
                        setShowLogin(false);
                        setLoginId('');
                        setLoginPass('');
                        setLoginError('');
                    } else {
                        setLoginError('ID atau Password salah!');
                    }
                }
            };

            const handleSaveSettings = (e) => {
                e.preventDefault();
                saveToCloud({ adminAuth: { id: newAdminId, pass: newAdminPass } });
                setShowSettings(false);
            };

            const handleAddWebUser = (e) => {
                e.preventDefault();
                if(!newWebUser || !newWebPass) return;
                const updated = [...(dataWebUsers || []), { user: newWebUser, pass: newWebPass }];
                setDataWebUsers(updated);
                saveToCloud({ dataWebUsers: updated });
                setNewWebUser('');
                setNewWebPass('');
            };

            const handleDeleteWebUser = (index) => {
                showConfirm("Hapus User", "Apakah Anda yakin ingin menghapus user ini?", () => {
                    const updated = dataWebUsers.filter((_, i) => i !== index);
                    setDataWebUsers(updated);
                    saveToCloud({ dataWebUsers: updated });
                });
            };

            const handleSendMessage = async () => {
                if (!inputValue.trim() || !firebaseDb || !loggedInUser) return;
                const messagesRef = firebaseDb.collection('artifacts').doc(appId).collection('public').doc('data').collection('messages');
                
                const newMsg = {
                    text: inputValue.trim(),
                    sender: loggedInUser.user === "Admin" ? CONTACT.name : loggedInUser.user,
                    timestamp: Date.now(),
                    avatar: `https://ui-avatars.com/api/?name=${loggedInUser.user === "Admin" ? CONTACT.name : loggedInUser.user}&background=fbcfe8&color=be185d&rounded=true`
                };
                
                try {
                    await messagesRef.add(newMsg);
                    setInputValue('');
                } catch (error) {
                    console.error("Error sending message:", error);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    handleSendMessage();
                }
            };

            const handleDeleteMessage = async (msgId) => {
                showConfirm("Hapus Pesan", "Apakah Anda yakin ingin menghapus pesan ini?", async () => {
                    try {
                        await firebaseDb.collection('artifacts').doc(appId).collection('public').doc('data').collection('messages').doc(msgId).delete();
                    } catch (error) {
                        console.error("Error deleting message:", error);
                    }
                });
            };

            const handleSaveEdit = async () => {
                if (!editMsgText.trim() || !editingMsgId) return;
                try {
                    await firebaseDb.collection('artifacts').doc(appId).collection('public').doc('data').collection('messages').doc(editingMsgId).update({
                        text: editMsgText.trim(),
                        editedAt: Date.now()
                    });
                    setEditingMsgId(null);
                    setEditMsgText('');
                } catch (error) {
                    console.error("Error updating message:", error);
                }
            };

            const formatTime = (ts) => {
                if (!ts) return '';
                const date = new Date(ts);
                return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            };

            return (
                <div className="h-full flex flex-col pt-2 overflow-hidden w-full">
                    <div className="bg-[#f8f9fa] rounded-3xl p-6 flex flex-col items-center text-center shadow-sm relative shrink-0">
                        <div className="absolute top-4 right-4 flex gap-2">
                            {loggedInUser ? (
                                <>
                                    {isAdminLoggedIn && (
                                        <button onClick={() => { setNewAdminId(adminAuth.id); setNewAdminPass(adminAuth.pass); setShowSettings(true); }} className="text-gray-400 hover:text-blue-600 flex items-center gap-1 text-xs font-bold" title="Pengaturan Admin">
                                            <Icons.Settings />
                                        </button>
                                    )}
                                    <button onClick={() => { setIsAdminLoggedIn(false); setIsEditMode(false); setLoggedInUser(null); }} className="text-gray-400 hover:text-red-500 flex items-center gap-1 text-xs font-bold" title="Logout">
                                        <Icons.Logout />
                                    </button>
                                </>
                            ) : (
                                <button onClick={() => setShowLogin(true)} className="text-gray-400 hover:text-blue-600 flex items-center gap-1 text-xs font-bold" title="Login">
                                    <Icons.Login />
                                </button>
                            )}
                        </div>
                        <div className="relative cursor-pointer transition-transform duration-300 hover:scale-110 active:scale-125">
                            <img src="https://i.ibb.co.com/vCHJJgRp/photoshoot-4.png" alt="Profile" className="w-20 h-20 rounded-full mb-3 shadow-md object-cover" />
                            <div className="absolute bottom-4 right-0 w-4 h-4 bg-green-400 border-2 border-white rounded-full"></div>
                        </div>
                        <h3 className="font-extrabold text-gray-900">{CONTACT.name}</h3>
                        <p className="text-xs text-gray-500 font-medium mb-4">@{CONTACT.name.toLowerCase()}</p>

                        {isAdminLoggedIn && (
                            <button 
                                onClick={() => setIsEditMode(!isEditMode)} 
                                className={`mb-5 px-4 py-1.5 rounded-full text-[10px] font-bold transition-colors shadow-sm flex items-center gap-1.5 ${isEditMode ? 'bg-red-50 text-red-600 border border-red-200 hover:bg-red-100' : 'bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100'}`}
                            >
                                <Icons.Edit /> {isEditMode ? 'Matikan Mode Edit' : 'Aktifkan Mode Edit'}
                            </button>
                        )}

                        <div className="flex gap-4">
                            <a href={CONTACT.wa_link} target="_blank" className="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm text-gray-600 hover:text-blue-600 hover:shadow-md transition-all"><Icons.Phone /></a>
                            <button className="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm text-gray-600 hover:text-blue-600 hover:shadow-md transition-all"><Icons.MoreDots /></button>
                        </div>
                    </div>

                    <div className="mt-8 flex-1 flex flex-col overflow-hidden">
                        <div className="flex justify-between items-center mb-6 px-2 border-b border-gray-100 pb-2 shrink-0">
                            <h4 className="text-sm font-bold text-gray-900">Aktivitas Terkini</h4>
                        </div>
                        
                        {loggedInUser ? (
                            <>
                                <div className="space-y-6 flex-1 overflow-y-auto custom-scrollbar px-2 pb-4">
                                    {messages.length === 0 ? (
                                        <p className="text-xs text-gray-400 text-center mt-4 font-medium">Belum ada pesan aktivitas.</p>
                                    ) : (
                                        messages.map((msg) => (
                                            <div key={msg.id} className="flex gap-3 group relative">
                                                <img src={msg.avatar} className="w-8 h-8 rounded-full shrink-0 object-cover" alt="avatar" />
                                                <div className="flex-1">
                                                    <div className="flex justify-between items-baseline mb-1">
                                                        <p className="text-sm font-bold text-gray-900">{msg.sender}</p>
                                                        <span className="text-[10px] text-gray-400 font-medium">{formatTime(msg.timestamp)} {msg.editedAt && '(diedit)'}</span>
                                                    </div>
                                                    {editingMsgId === msg.id ? (
                                                        <div className="flex flex-col gap-2 mt-1">
                                                            <input type="text" value={editMsgText} onChange={(e) => setEditMsgText(e.target.value)} className="w-full text-xs p-2 border border-blue-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500" autoFocus />
                                                            <div className="flex gap-2 justify-end">
                                                                <button onClick={() => setEditingMsgId(null)} className="text-[10px] font-bold px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200">Batal</button>
                                                                <button onClick={handleSaveEdit} className="text-[10px] font-bold px-3 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Simpan</button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <p className="text-xs text-gray-500 break-words">{msg.text}</p>
                                                    )}
                                                </div>
                                                {isEditMode && editingMsgId !== msg.id && (
                                                    <div className="absolute top-0 right-0 hidden group-hover:flex gap-1 bg-white p-1 rounded-lg shadow-sm border border-gray-100">
                                                        <button onClick={() => { setEditingMsgId(msg.id); setEditMsgText(msg.text); }} className="text-blue-500 hover:bg-blue-50 p-1.5 rounded-md"><Icons.Edit /></button>
                                                        <button onClick={() => handleDeleteMessage(msg.id)} className="text-red-500 hover:bg-red-50 p-1.5 rounded-md"><Icons.Trash /></button>
                                                    </div>
                                                )}
                                            </div>
                                        ))
                                    )}
                                    <div ref={messagesEndRef} />
                                </div>

                                <div className="mt-2 pt-4 border-t border-gray-100 shrink-0">
                                    <div className="relative flex items-center">
                                        <input 
                                            type="text" 
                                            value={inputValue}
                                            onChange={(e) => setInputValue(e.target.value)}
                                            onKeyDown={handleKeyDown}
                                            placeholder="Tulis pesan..." 
                                            className="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 pl-4 pr-12 text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 font-medium" 
                                        />
                                        <button onClick={handleSendMessage} className="absolute right-2 w-8 h-8 bg-black text-white rounded-xl flex items-center justify-center hover:bg-gray-800 transition-colors shadow-sm active:scale-95">
                                            <Icons.Send />
                                        </button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-center px-4">
                                <div className="w-14 h-14 bg-gray-50 rounded-full flex items-center justify-center text-gray-400 mb-4 shadow-inner"><Icons.Lock /></div>
                                <p className="text-sm font-bold text-gray-900 mb-2">Akses Terkunci</p>
                                <p className="text-xs text-gray-500 mb-6 leading-relaxed">Fitur pesan aktivitas memerlukan login.</p>
                                <button onClick={() => setShowLogin(true)} className="bg-black text-white text-xs font-bold px-6 py-2.5 rounded-xl hover:bg-gray-800 shadow-sm transition-transform active:scale-95">Login Sekarang</button>
                            </div>
                        )}
                    </div>

                    {showLogin && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 p-4">
                            <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden fade-in border border-gray-100">
                                <div className="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-[#f8f9fa]">
                                    <h3 className="font-extrabold text-lg text-gray-900">Login Sistem</h3>
                                    <button onClick={() => setShowLogin(false)} className="text-gray-400 hover:text-red-500 transition-colors"><Icons.X /></button>
                                </div>
                                <form onSubmit={handleLoginSubmit} className="p-6 space-y-5">
                                    <div>
                                        <label className="block text-xs font-extrabold text-gray-700 mb-2 uppercase tracking-wider">ID Pengguna</label>
                                        <input type="text" value={loginId} onChange={e => setLoginId(e.target.value)} className="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-100 text-sm font-medium" placeholder="Masukkan ID" required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-extrabold text-gray-700 mb-2 uppercase tracking-wider">Password</label>
                                        <input type="password" value={loginPass} onChange={e => setLoginPass(e.target.value)} className="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-100 text-sm font-medium" placeholder="Masukkan Password" required />
                                        {loginError && <p className="text-red-500 text-xs mt-2 font-bold">{loginError}</p>}
                                    </div>
                                    <div className="pt-2">
                                        <button type="submit" className="w-full py-3 bg-black text-white font-extrabold rounded-xl hover:bg-gray-800 transition-colors shadow-md">Masuk</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showSettings && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 p-4">
                            <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden fade-in border border-gray-100 max-h-[90vh] flex flex-col">
                                <div className="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-[#f8f9fa] shrink-0">
                                    <h3 className="font-extrabold text-lg text-gray-900">Pengaturan Akses</h3>
                                    <button onClick={() => setShowSettings(false)} className="text-gray-400 hover:text-red-500 transition-colors"><Icons.X /></button>
                                </div>
                                <div className="p-6 overflow-y-auto custom-scrollbar space-y-8">
                                    <form onSubmit={handleSaveSettings} className="space-y-4">
                                        <h4 className="font-extrabold text-sm text-gray-900 border-b border-gray-100 pb-2">Kredensial Admin</h4>
                                        <div>
                                            <label className="block text-[10px] font-extrabold text-gray-500 mb-1 uppercase tracking-wider">ID Admin</label>
                                            <input type="text" value={newAdminId} onChange={e => setNewAdminId(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-100 text-xs font-medium" required />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-extrabold text-gray-500 mb-1 uppercase tracking-wider">Password Admin</label>
                                            <input type="text" value={newAdminPass} onChange={e => setNewAdminPass(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-100 text-xs font-medium" required />
                                        </div>
                                        <button type="submit" className="w-full py-2 bg-black text-white text-xs font-extrabold rounded-lg hover:bg-gray-800 transition-colors">Simpan Admin</button>
                                    </form>

                                    <div className="space-y-4">
                                        <h4 className="font-extrabold text-sm text-gray-900 border-b border-gray-100 pb-2">User Web (Akses Pesan)</h4>
                                        <form onSubmit={handleAddWebUser} className="flex gap-2">
                                            <input type="text" value={newWebUser} onChange={e => setNewWebUser(e.target.value)} placeholder="ID User Baru" className="w-1/2 px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-100 text-xs font-medium" required />
                                            <input type="text" value={newWebPass} onChange={e => setNewWebPass(e.target.value)} placeholder="Password Baru" className="w-1/2 px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-100 text-xs font-medium" required />
                                            <button type="submit" className="bg-blue-600 text-white px-3 py-2 rounded-lg hover:bg-blue-700"><Icons.Plus /></button>
                                        </form>
                                        <div className="border border-gray-100 rounded-lg overflow-hidden">
                                            {dataWebUsers?.length > 0 ? dataWebUsers.map((u, i) => (
                                                <div key={i} className="flex justify-between items-center px-4 py-2 text-xs border-b last:border-0 border-gray-100 bg-gray-50">
                                                    <div>
                                                        <span className="font-bold text-gray-800 block">{u.user}</span>
                                                        <span className="text-gray-500 font-mono text-[10px]">{u.pass}</span>
                                                    </div>
                                                    <button onClick={() => handleDeleteWebUser(i)} className="text-red-500 hover:bg-red-50 p-1.5 rounded-md"><Icons.Trash /></button>
                                                </div>
                                            )) : (
                                                <div className="p-4 text-center text-xs text-gray-500">Belum ada user terdaftar.</div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const getGridClass = (cols) => {
            if (cols === 2) return "grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mb-8";
            if (cols === 3) return "grid grid-cols-2 sm:grid-cols-3 gap-3 md:gap-4 mb-8";
            if (cols === 4) return "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4 mb-8";
            if (cols === 5) return "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 md:gap-4 mb-8";
            if (cols === 6) return "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 md:gap-4 mb-8";
            if (cols === 7) return "grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3 md:gap-4 mb-8";
            if (cols === 8) return "grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-3 md:gap-4 mb-8";
            return "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4 mb-8";
        };

        function GridControl({ section, gridCols, onGridChange }) {
            return (
                <div className="flex items-center gap-2 bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-lg text-xs font-bold text-gray-600 dark:text-gray-300">
                    <span>Kolom Desktop:</span>
                    {[2, 3, 4, 5, 6, 7, 8].map(num => (
                        <button key={num} onClick={() => onGridChange(section, num)} className={`w-6 h-6 rounded flex items-center justify-center ${gridCols[section] === num ? 'bg-pink-600 text-white' : 'bg-white dark:bg-gray-700 hover:bg-gray-200'}`}>
                            {num}
                        </button>
                    ))}
                </div>
            );
        }

        function NavButton({ active, icon, label, badge, onClick }) {
            return (
                <button onClick={onClick} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl transition-all ${active ? 'bg-black text-white shadow-md' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900'}`}>
                    <div className="flex items-center gap-3">
                        <div className={active ? 'text-white' : 'text-gray-400'}>{icon}</div>
                        <span className="font-bold text-sm">{label}</span>
                    </div>
                    {badge && <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full ${active ? 'bg-gray-800 text-white' : 'bg-blue-100 text-blue-600'}`}>{badge}</span>}
                </button>
            );
        }

        function HomeView({ setActiveView, dataApps, dataReports, dataMonitoring, dataDocuments }) {
            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-3xl p-8 text-white shadow-lg relative overflow-hidden">
                        <div className="relative z-10">
                            <h2 className="text-3xl font-extrabold mb-2">Selamat Datang, Tim HUB! 👋</h2>
                            <p className="text-blue-100 max-w-xl text-sm leading-relaxed">Kelola semua operasional harian Anda dalam satu platform yang terintegrasi.</p>
                        </div>
                        <div className="absolute right-0 bottom-0 opacity-10 transform translate-x-1/4 translate-y-1/4">
                            <svg width="200" height="200" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2zm0 4l7.5 14h-15L12 6z"/></svg>
                        </div>
                    </div>

                    <div className="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><Icons.Home /> Motivasi Hari Ini</h3>
                        <div className="p-6 bg-gray-50 rounded-xl border-l-4 border-blue-500 italic text-gray-600">
                            "Kerja tim adalah kemampuan untuk bekerja sama menuju visi bersama. Kemampuan untuk mengarahkan pencapaian individu ke arah tujuan organisasi. Itulah bahan bakar yang memungkinkan orang biasa mencapai hasil yang tidak biasa." - Andrew Carnegie
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm cursor-pointer hover:border-blue-300 transition-colors" onClick={() => setActiveView('apps')}>
                            <div className="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mb-3"><Icons.Grid /></div>
                            <h4 className="font-bold text-gray-800">Aplikasi Utama</h4>
                            <p className="text-xs text-gray-500 mt-1">{dataApps.length} Aplikasi</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm cursor-pointer hover:border-green-300 transition-colors" onClick={() => setActiveView('reports')}>
                            <div className="w-10 h-10 bg-green-50 text-green-600 rounded-xl flex items-center justify-center mb-3"><Icons.Report /></div>
                            <h4 className="font-bold text-gray-800">Laporan</h4>
                            <p className="text-xs text-gray-500 mt-1">{dataReports.length} Laporan</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm cursor-pointer hover:border-orange-300 transition-colors" onClick={() => setActiveView('monitoring')}>
                            <div className="w-10 h-10 bg-orange-50 text-orange-600 rounded-xl flex items-center justify-center mb-3"><Icons.Monitor /></div>
                            <h4 className="font-bold text-gray-800">Monitoring</h4>
                            <p className="text-xs text-gray-500 mt-1">{dataMonitoring.length} Tools</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm cursor-pointer hover:border-purple-300 transition-colors" onClick={() => setActiveView('documents')}>
                            <div className="w-10 h-10 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center mb-3"><Icons.Folder /></div>
                            <h4 className="font-bold text-gray-800">Dokumen</h4>
                            <p className="text-xs text-gray-500 mt-1">{dataDocuments.length} File</p>
                        </div>
                    </div>
                </div>
            );
        }

        function AppsView({ data, dataAccounts, isEditMode, onDelete, onEdit, onAdd, onDeleteAccount, onEditAccount, onAddAccount, gridCols, onGridChange, showAlert }) {
            const { useState } = React;
            const [searchTerm, setSearchTerm] = useState('');
            
            const filteredAccounts = dataAccounts.filter(acc => 
                acc.user.toLowerCase().includes(searchTerm.toLowerCase()) || 
                (acc.hub && acc.hub.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (acc.rute && acc.rute.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (acc.app && acc.app.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            return (
                <div className="space-y-8 fade-in">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-extrabold text-gray-900">Aplikasi & Sistem</h2>
                            <p className="text-gray-500 text-sm mt-1">Akses cepat ke seluruh sistem operasional.</p>
                        </div>
                        {isEditMode && <GridControl section="apps" gridCols={gridCols} onGridChange={onGridChange} />}
                    </div>

                    <div className={getGridClass(gridCols.apps)}>
                        {data.map((item, index) => (
                            <ItemCard key={index} item={item} isEditMode={isEditMode} onDelete={() => onDelete('apps', index)} onEdit={() => onEdit('apps', index, item)} showAlert={showAlert} />
                        ))}
                        {isEditMode && (
                            <button onClick={onAdd} className="h-full min-h-[140px] border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 hover:text-blue-600 hover:border-blue-300 hover:bg-blue-50 transition-all">
                                <Icons.Plus />
                                <span className="text-xs font-bold mt-2">Tambah Aplikasi</span>
                            </button>
                        )}
                    </div>

                    <div className="pt-8 border-t border-gray-100">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <div>
                                <h3 className="text-xl font-bold text-gray-900">Manajemen Akun Tim</h3>
                                <p className="text-sm text-gray-500 mt-1">Daftar kredensial akses sistem.</p>
                            </div>
                            <div className="flex items-center gap-2 w-full sm:w-auto">
                                <div className="relative flex-1 sm:w-64">
                                    <input type="text" placeholder="Cari akun, hub, rute..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-100" />
                                    <div className="absolute left-3 top-2.5 text-gray-400"><Icons.Filter /></div>
                                </div>
                                {isEditMode && (
                                    <button onClick={onAddAccount} className="bg-black text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-gray-800 flex items-center gap-2 flex-shrink-0">
                                        <Icons.Plus /> Tambah Akun
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[600px]">
                                <thead>
                                    <tr className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider sticky-header">
                                        <th className="p-4 font-bold border-b border-gray-100">User ID</th>
                                        <th className="p-4 font-bold border-b border-gray-100">Password</th>
                                        <th className="p-4 font-bold border-b border-gray-100">Aplikasi</th>
                                        <th className="p-4 font-bold border-b border-gray-100">HUB</th>
                                        <th className="p-4 font-bold border-b border-gray-100">Rute</th>
                                        {isEditMode && <th className="p-4 font-bold border-b border-gray-100 text-right">Aksi</th>}
                                    </tr>
                                </thead>
                                <tbody className="text-sm">
                                    {filteredAccounts.map((acc, index) => {
                                        const actualIndex = dataAccounts.indexOf(acc);
                                        return (
                                            <tr key={index} className="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
                                                <td className="p-4 font-bold text-gray-900">{acc.user}</td>
                                                <td className="p-4 font-mono text-gray-600">{acc.pass}</td>
                                                <td className="p-4 text-gray-600"><span className="bg-blue-50 text-blue-600 px-2.5 py-1 rounded-md text-[10px] font-bold">{acc.app}</span></td>
                                                <td className="p-4 text-gray-600">{acc.hub}</td>
                                                <td className="p-4 text-gray-500 text-xs">{acc.rute || '-'}</td>
                                                {isEditMode && (
                                                    <td className="p-4 text-right">
                                                        <button onClick={() => onEditAccount(actualIndex, acc)} className="text-blue-500 hover:bg-blue-50 p-2 rounded-lg mr-2"><Icons.Edit /></button>
                                                        <button onClick={() => onDeleteAccount(actualIndex)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg"><Icons.Trash /></button>
                                                    </td>
                                                )}
                                            </tr>
                                        );
                                    })}
                                    {filteredAccounts.length === 0 && (
                                        <tr>
                                            <td colSpan={isEditMode ? 6 : 5} className="p-8 text-center text-gray-500 text-sm">Tidak ada akun yang ditemukan.</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function ReportsView({ data, isEditMode, onDelete, onEdit, onAdd, gridCols, onGridChange, showAlert }) {
            const categories = [...new Set(data.map(item => item.category || 'Lainnya'))];
            return (
                <div className="space-y-8 fade-in">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-extrabold text-gray-900">Laporan Operasional</h2>
                            <p className="text-gray-500 text-sm mt-1">Akses semua form dan laporan monitoring.</p>
                        </div>
                        {isEditMode && <GridControl section="reports" gridCols={gridCols} onGridChange={onGridChange} />}
                    </div>

                    {categories.map(category => (
                        <div key={category} className="space-y-4">
                            <h3 className="font-bold text-gray-800 text-sm bg-gray-100 inline-block px-3 py-1.5 rounded-lg">{category}</h3>
                            <div className={getGridClass(gridCols.reports)}>
                                {data.filter(item => (item.category || 'Lainnya') === category).map((item, index) => {
                                    const actualIndex = data.indexOf(item);
                                    return <ItemCard key={actualIndex} item={item} isEditMode={isEditMode} onDelete={() => onDelete('reports', actualIndex)} onEdit={() => onEdit('reports', actualIndex, item)} showAlert={showAlert} />
                                })}
                                {isEditMode && (
                                    <button onClick={onAdd} className="h-full min-h-[140px] border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 hover:text-blue-600 hover:border-blue-300 hover:bg-blue-50 transition-all">
                                        <Icons.Plus />
                                        <span className="text-xs font-bold mt-2">Tambah di {category}</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    ))}
                    {isEditMode && categories.length === 0 && (
                        <div className={getGridClass(gridCols.reports)}>
                            <button onClick={onAdd} className="h-full min-h-[140px] border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 hover:text-blue-600 hover:border-blue-300 hover:bg-blue-50 transition-all">
                                <Icons.Plus />
                                <span className="text-xs font-bold mt-2">Tambah Laporan</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function MonitoringView({ data, isEditMode, onDelete, onEdit, onAdd, gridCols, onGridChange, showAlert }) {
            return (
                <div className="space-y-8 fade-in">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-extrabold text-gray-900">Tim & Monitoring</h2>
                            <p className="text-gray-500 text-sm mt-1">Alat monitoring dan pencatatan masalah.</p>
                        </div>
                        {isEditMode && <GridControl section="monitoring" gridCols={gridCols} onGridChange={onGridChange} />}
                    </div>

                    <div className={getGridClass(gridCols.monitoring)}>
                        {data.map((item, index) => (
                            <ItemCard key={index} item={item} isEditMode={isEditMode} onDelete={() => onDelete('monitoring', index)} onEdit={() => onEdit('monitoring', index, item)} showAlert={showAlert} />
                        ))}
                        {isEditMode && (
                            <button onClick={onAdd} className="h-full min-h-[140px] border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 hover:text-blue-600 hover:border-blue-300 hover:bg-blue-50 transition-all">
                                <Icons.Plus />
                                <span className="text-xs font-bold mt-2">Tambah Monitoring</span>
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        function DocumentsView({ data, isEditMode, onDelete, onEdit, onAdd, gridCols, onGridChange, showAlert }) {
            const categories = [...new Set(data.map(item => item.category || 'Lainnya'))];
            return (
                <div className="space-y-8 fade-in">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-extrabold text-gray-900">Pengaturan Dokumen</h2>
                            <p className="text-gray-500 text-sm mt-1">SOP, materi, dan panduan operasional.</p>
                        </div>
                        {isEditMode && <GridControl section="documents" gridCols={gridCols} onGridChange={onGridChange} />}
                    </div>

                    {categories.map(category => (
                        <div key={category} className="space-y-4">
                            <h3 className="font-bold text-gray-800 text-sm bg-gray-100 inline-block px-3 py-1.5 rounded-lg">{category}</h3>
                            <div className={getGridClass(gridCols.documents)}>
                                {data.filter(item => (item.category || 'Lainnya') === category).map((item, index) => {
                                    const actualIndex = data.indexOf(item);
                                    return <ItemCard key={actualIndex} item={item} isEditMode={isEditMode} onDelete={() => onDelete('documents', actualIndex)} onEdit={() => onEdit('documents', actualIndex, item)} showAlert={showAlert} />
                                })}
                                {isEditMode && (
                                    <button onClick={onAdd} className="h-full min-h-[140px] border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 hover:text-blue-600 hover:border-blue-300 hover:bg-blue-50 transition-all">
                                        <Icons.Plus />
                                        <span className="text-xs font-bold mt-2">Tambah Dokumen</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    ))}
                    {isEditMode && categories.length === 0 && (
                        <div className={getGridClass(gridCols.documents)}>
                            <button onClick={onAdd} className="h-full min-h-[140px] border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 hover:text-blue-600 hover:border-blue-300 hover:bg-blue-50 transition-all">
                                <Icons.Plus />
                                <span className="text-xs font-bold mt-2">Tambah Dokumen</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

                        <div className="relative z-10 flex-1 text-center sm:text-left">

                                <span className="w-2 h-2 rounded-full bg-green-400 animate-ping"></span>
                                Identitas 100% Aman & Dilindungi

                            <h2 className="text-3xl sm:text-4xl font-extrabold mb-4 leading-tight">Satu laporan Anda <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">menyelamatkan</span> masa depan perusahaan.</h2>
                            <p className="text-slate-400 text-sm sm:text-base leading-relaxed max-w-xl">

                            <div className="space-y-4">

                                    <div><strong className="text-gray-900 text-sm">Where:</strong> <p className="text-xs text-gray-500 mt-1">Dimana perbuatan pelanggaran dilakukan (Unit Kerja, Staging, Hub, dll).</p></div>
                                </div>
                                <div className="flex items-start gap-3">
                                    <div className="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0 mt-0.5"><Icons.Check /></div>
                                    <div><strong className="text-gray-900 text-sm">When:</strong> <p className="text-xs text-gray-500 mt-1">Kapan perbuatan pelanggaran dilakukan (Tanggal, Hari, Waktu).</p></div>
                                </div>
                                <div className="flex items-start gap-3">
                                    <div className="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0 mt-0.5"><Icons.Check /></div>
                                    <div><strong className="text-gray-900 text-sm">Why:</strong> <p className="text-xs text-gray-500 mt-1">Mengapa perbuatan tersebut dilakukan.</p></div>
                                </div>
                                <div className="flex items-start gap-3">

                                    <div><strong className="text-gray-900 text-sm">How:</strong> <p className="text-xs text-gray-500 mt-1">Bagaimana perbuatan pelanggaran itu dilakukan (Modus).</p></div>
